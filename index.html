// Boss type definitions
const BOSS_TYPES = [
  { id: 'brute',      name: 'THE BRUTE',      color: '#6a2e8a', auraColor: '#a3f',  eyeColor: '#f0f' },
  { id: 'inferno',    name: 'INFERNO',         color: '#a02000', auraColor: '#f60',  eyeColor: '#ff0' },
  { id: 'frost_titan', name: 'FROST TITAN',    color: '#1a5080', auraColor: '#4cf',  eyeColor: '#aef' },
  { id: 'necro_lord', name: 'NECRO LORD',      color: '#3a0050', auraColor: '#a0f',  eyeColor: '#f0f' },
  { id: 'hydra',      name: 'THE HYDRA',       color: '#206830', auraColor: '#4f4',  eyeColor: '#8f8' },
];

function getBossType(w) {
  let idx = Math.floor(w / 10) - 1;
  return BOSS_TYPES[idx % BOSS_TYPES.length];
}

function spawnBoss() {
  let angle = Math.random() * Math.PI * 2;
  let dist = Math.max(CW, CH) / 2 + 80;
  let x = CW / 2 + Math.cos(angle) * dist;
  let y = CH / 2 + Math.sin(angle) * dist;
  let bossInfo = getBossType(wave);
  let cycle = Math.floor((Math.floor(wave / 10) - 1) / BOSS_TYPES.length);
  let hpMult = 1 + cycle * 0.5;
  let dmgMult = 1 + cycle * 0.3;
  let baseHp, baseDmg, radius, speed;
  switch (bossInfo.id) {
    case 'brute':
      baseHp = 15 + wave * 3; baseDmg = 20 + wave * 2; radius = 38; speed = 1.0 + wave * 0.03; break;
    case 'inferno':
      baseHp = 12 + wave * 2.5; baseDmg = 15 + wave * 2; radius = 34; speed = 1.4 + wave * 0.04; break;
    case 'frost_titan':
      baseHp = 25 + wave * 4; baseDmg = 18 + wave * 1.5; radius = 44; speed = 0.6 + wave * 0.02; break;
    case 'necro_lord':
      baseHp = 14 + wave * 2.5; baseDmg = 12 + wave * 1.5; radius = 36; speed = 0.8 + wave * 0.025; break;
    case 'hydra':
      baseHp = 20 + wave * 3.5; baseDmg = 16 + wave * 1.8; radius = 40; speed = 0.9 + wave * 0.03; break;
    default:
      baseHp = 15 + wave * 3; baseDmg = 20 + wave * 2; radius = 38; speed = 1.0 + wave * 0.03;
  }
  let hp = Math.floor(baseHp * hpMult);
  let damage = Math.floor(baseDmg * dmgMult);
  zombies.push({
    x, y, radius, speed, hp, maxHp: hp,
    damage, hitFlash: 0, attackCooldown: 0,
    isBoss: true, bossCharging: false, chargeTimer: 0,
    chargeCooldown: 120 + Math.floor(Math.random() * 60),
    chargeVx: 0, chargeVy: 0,
    zombieType: 'boss', bossId: bossInfo.id, ghostPhase: 0, ghostSolid: true,
    necroTimer: bossInfo.id === 'necro_lord' ? 150 : 0,
    exploded: false, spitCooldown: bossInfo.id === 'inferno' ? 80 : 999,
    fireTrailTimer: 0, frozenAuraTimer: 0, hydraPhase: 0,
    burnTimer: 0, burnDmg: 0, slowTimer: 0, slowFactor: 1,
    aggro: true
  });
}

// ── Particles ──────────────────────────────────────────
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    let a = Math.random() * Math.PI * 2;
    let spd = 1 + Math.random() * 3;
    particles.push({
      x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      life: 20 + Math.random() * 15, maxLife: 35,
      radius: 2 + Math.random() * 3, color
    });
  }
}

// ── Update ─────────────────────────────────────────────
function update() {
  titlePulse += 0.03;
  if (screen !== 'playing') return;

  stats.timeSurvived++;
  if (wave > stats.highestWave) stats.highestWave = wave;

  // Dash logic
  if (dashTimer > 0) {
    player.x += dashVx;
    player.y += dashVy;
    dashTimer--;
    // Dash trail particles
    spawnParticles(player.x, player.y, '#4af', 1);
  }
  if (dashCooldown > 0) dashCooldown--;
  if (shockwaveCooldown > 0) shockwaveCooldown--;
  if (shockwaveEffect > 0) shockwaveEffect--;
  if (axeCooldown > 0) axeCooldown--;

  // Crystal vitality HP regen
  let vitalLvl = crystalUpgradeLevels.vitality;
  let totalRegenRate = CRYSTAL_UPGRADES.vitality.regenRate[vitalLvl];
  // Zombie class natural regen
  let curCls = CLASSES[selectedClass] || CLASSES.tank;
  if (curCls.regenRate) totalRegenRate += curCls.regenRate;
  if (totalRegenRate > 0 && player.hp < player.maxHp) {
    regenAccumulator += totalRegenRate / 60;
    if (regenAccumulator >= 1) {
      let heal = Math.floor(regenAccumulator);
      player.hp = Math.min(player.hp + heal, player.maxHp);
      regenAccumulator -= heal;
    }
  }

  // Player movement (skip during dash)
  player.speed = player.baseSpeed; // reset speed each frame before boss effects
  let dx = 0, dy = 0;
  if (dashTimer <= 0) {
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    // Mobile joystick input
    if (isMobile && joystick.active) {
      let jdx = joystick.curX - joystick.startX;
      let jdy = joystick.curY - joystick.startY;
      let jdist = Math.sqrt(jdx * jdx + jdy * jdy);
      if (jdist > 10) {
        dx += jdx / jdist;
        dy += jdy / jdist;
      }
    }
    if (dx || dy) {
      let len = Math.sqrt(dx * dx + dy * dy);
      player.x += (dx / len) * player.speed;
      player.y += (dy / len) * player.speed;
    }
  }
  player.x = Math.max(player.radius, Math.min(CW - player.radius, player.x));
  player.y = Math.max(player.radius, Math.min(CH - player.radius, player.y));
  if (isMobile) {
    // On mobile, aim toward closest zombie or last touch aim point
    if (zombies.length > 0) {
      let closestZ = null, closestD = Infinity;
      for (let z of zombies) {
        let d = Math.hypot(z.x - player.x, z.y - player.y);
        if (d < closestD) { closestD = d; closestZ = z; }
      }
      if (closestZ && closestD < 300) {
        player.angle = Math.atan2(closestZ.y - player.y, closestZ.x - player.x);
      } else {
        player.angle = Math.atan2(touchAimY - player.y, touchAimX - player.x);
      }
    }
  } else {
    player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  }
  if (player.iFrames > 0) player.iFrames--;
  if (player.damageFlash > 0) player.damageFlash--;

  // Auto-slash — aim toward closest zombie
  let autoLvl = upgradeLevels.autoSlash;
  if (autoLvl > 0) {
    autoSwingCooldown--;
    if (autoSwingCooldown <= 0 && !swinging) {
      let closestZ = null, closestD = Infinity;
      for (let z of zombies) {
        let d = Math.hypot(z.x - player.x, z.y - player.y);
        if (d < closestD) { closestD = d; closestZ = z; }
      }
      if (closestZ) {
        player.angle = Math.atan2(closestZ.y - player.y, closestZ.x - player.x);
      }
      swinging = true;
      swingTimer = SWING_DURATION;
      autoSwingCooldown = UPGRADES.autoSlash.interval[autoLvl];
    }
  }

  // Sword stats from upgrade
  let cls = CLASSES[selectedClass] || CLASSES.tank;
  let swordLvl = upgradeLevels.sword;
  let swordLen = UPGRADES.sword.length[swordLvl];
  let swordDmg = Math.floor(UPGRADES.sword.damage[swordLvl] * cls.swordMult);
  let swordKB  = UPGRADES.sword.knockback[swordLvl];

  // Viking Axe attack (replaces sword for Viking class)
  if (cls.hasAxe) {
    if (axeSwinging) {
      axeSwingTimer--;
      let progress = 1 - axeSwingTimer / AXE_SWING_DURATION;
      let curAngle = player.angle - Math.PI * 0.6 + Math.PI * 1.2 * progress;
      let axeLen = 80;
      for (let z of zombies) {
        if (z.zombieType === 'ghost' && !z.ghostSolid) continue;
        let toZ = Math.atan2(z.y - player.y, z.x - player.x);
        let dist = Math.hypot(z.x - player.x, z.y - player.y);
        let aDiff = Math.abs(angleDelta(curAngle, toZ));
        if (dist < axeLen + z.radius + player.radius && aDiff < 0.4) {
          if (z.hitFlash <= 0) {
            z.hp = 0; // one-hit kill
            z.hitFlash = 8;
            stats.damageDealt += z.maxHp;
            let a = Math.atan2(z.y - player.y, z.x - player.x);
            z.x += Math.cos(a) * 20;
            z.y += Math.sin(a) * 20;
            spawnParticles(z.x, z.y, '#c73', 8);
          }
        }
      }
      if (axeSwingTimer <= 0) { axeSwinging = false; axeCooldown = AXE_COOLDOWN_MAX; }
    }
  }

  // Sword swing (disabled for Viking — they use axe)
  if (swinging && !cls.hasAxe) {
    swingTimer--;
    let progress = 1 - swingTimer / SWING_DURATION;
    let curAngle = player.angle - SWORD_ARC / 2 + SWORD_ARC * progress;

    for (let z of zombies) {
      // Ghost check: can't hit during transparent phase
      if (z.zombieType === 'ghost' && !z.ghostSolid) continue;
      let toZ = Math.atan2(z.y - player.y, z.x - player.x);
      let dist = Math.hypot(z.x - player.x, z.y - player.y);
      let aDiff = Math.abs(angleDelta(curAngle, toZ));
      if (dist < swordLen + z.radius + player.radius && aDiff < 0.35) {
        if (z.hitFlash <= 0) {
          z.hp -= swordDmg;
          z.hitFlash = 8;
          stats.damageDealt += swordDmg;
          let a = Math.atan2(z.y - player.y, z.x - player.x);
          let kb = z.isBoss ? swordKB * 0.4 : swordKB;
          z.x += Math.cos(a) * kb;
          z.y += Math.sin(a) * kb;
          spawnParticles(z.x, z.y, z.isBoss ? '#f4f' : '#4f4', 5);
        }
      }
    }
    if (swingTimer <= 0) swinging = false;
  }

  // Spawn zombies
  if (zombiesLeft > 0) {
    spawnTimer--;
    if (spawnTimer <= 0) {
      if (bossActive && zombiesLeft === 1) {
        spawnBoss();
      } else {
        spawnZombie();
      }
      zombiesLeft--;
      spawnTimer = Math.max(10, 40 - wave * 2);
    }
  }

  // Shield reduction
  let shieldLvl = upgradeLevels.shield;
  let dmgReduction = Math.min(0.9, UPGRADES.shield.reduction[shieldLvl] * cls.shieldMult);

  // Update zombies
  for (let i = zombies.length - 1; i >= 0; i--) {
    let z = zombies[i];
    if (z.hitFlash > 0) { z.hitFlash--; z.aggro = true; }
    if (z.attackCooldown > 0) z.attackCooldown--;

    // Burn DOT
    if (z.burnTimer > 0) {
      z.burnTimer--;
      if (z.burnTimer % 15 === 0) {
        z.hp -= z.burnDmg;
        z.hitFlash = 4;
        stats.damageDealt += z.burnDmg;
        spawnParticles(z.x, z.y, '#f60', 2);
      }
    }
    // Slow decay
    if (z.slowTimer > 0) z.slowTimer--;

    // Effective speed (apply slow)
    let effSpeed = z.speed * (z.slowTimer > 0 ? z.slowFactor : 1);

    // Ghost phase toggling
    if (z.zombieType === 'ghost') {
      z.ghostPhase++;
      z.ghostSolid = (z.ghostPhase % 120) < 60;
    }

    // Boss abilities
    if (z.isBoss) {
      let bInfo = getBossType(wave);
      let bid = z.bossId || 'brute';

      if (bid === 'brute') {
        // Brute: charge attack
        if (z.bossCharging) {
          z.x += z.chargeVx; z.y += z.chargeVy;
          z.chargeTimer--;
          spawnParticles(z.x, z.y, '#a3f', 1);
          if (z.chargeTimer <= 0) { z.bossCharging = false; z.chargeCooldown = 120 + Math.floor(Math.random() * 60); }
        } else {
          z.chargeCooldown--;
          if (z.chargeCooldown <= 0) {
            let a = Math.atan2(player.y - z.y, player.x - z.x);
            z.chargeVx = Math.cos(a) * 6; z.chargeVy = Math.sin(a) * 6;
            z.chargeTimer = 30; z.bossCharging = true;
          } else {
            let a = Math.atan2(player.y - z.y, player.x - z.x);
            z.x += Math.cos(a) * effSpeed; z.y += Math.sin(a) * effSpeed;
          }
        }
      } else if (bid === 'inferno') {
        // Inferno: fast, leaves fire trail, shoots fireballs
        let a = Math.atan2(player.y - z.y, player.x - z.x);
        z.x += Math.cos(a) * effSpeed; z.y += Math.sin(a) * effSpeed;
        z.fireTrailTimer = (z.fireTrailTimer || 0) + 1;
        if (z.fireTrailTimer % 8 === 0) {
          poisonClouds.push({ x: z.x, y: z.y, radius: 25, damage: 2 + Math.floor(wave / 5), life: 120, color: '#f60', type: 'fire' });
        }
        z.spitCooldown--;
        if (z.spitCooldown <= 0) {
          for (let s = 0; s < 3; s++) {
            let sa = a + (s - 1) * 0.3;
            acidBullets.push({ x: z.x, y: z.y, vx: Math.cos(sa) * 3.5, vy: Math.sin(sa) * 3.5, radius: 6, damage: 8 + Math.floor(wave / 2), life: 120, color: '#f80' });
          }
          z.spitCooldown = 70 + Math.floor(Math.random() * 30);
        }
      } else if (bid === 'frost_titan') {
        // Frost Titan: slow but tanky, aura slows player
        let a = Math.atan2(player.y - z.y, player.x - z.x);
        z.x += Math.cos(a) * effSpeed; z.y += Math.sin(a) * effSpeed;
        let distToP = Math.hypot(z.x - player.x, z.y - player.y);
        if (distToP < 160) {
          player.speed = player.baseSpeed * 0.55;
          z.frozenAuraTimer = 10;
          if (Math.random() < 0.03) spawnParticles(player.x + (Math.random()-0.5)*40, player.y + (Math.random()-0.5)*40, '#aef', 2);
        }
        // Ice shockwave every few seconds
        z.chargeCooldown--;
        if (z.chargeCooldown <= 0) {
          for (let s = 0; s < 8; s++) {
            let sa = (Math.PI * 2 / 8) * s;
            acidBullets.push({ x: z.x, y: z.y, vx: Math.cos(sa) * 2.5, vy: Math.sin(sa) * 2.5, radius: 8, damage: 6 + Math.floor(wave / 3), life: 80, color: '#4cf' });
          }
          spawnParticles(z.x, z.y, '#4cf', 12);
          z.chargeCooldown = 180 + Math.floor(Math.random() * 60);
        }
      } else if (bid === 'necro_lord') {
        // Necro Lord: summons minions, stays at range
        let distToP = Math.hypot(z.x - player.x, z.y - player.y);
        let a = Math.atan2(player.y - z.y, player.x - z.x);
        if (distToP > 200) {
          z.x += Math.cos(a) * effSpeed; z.y += Math.sin(a) * effSpeed;
        } else if (distToP < 150) {
          z.x -= Math.cos(a) * effSpeed * 0.5; z.y -= Math.sin(a) * effSpeed * 0.5;
        }
        z.necroTimer--;
        if (z.necroTimer <= 0 && zombies.length < 40) {
          for (let m = 0; m < 2; m++) {
            let ma = Math.random() * Math.PI * 2;
            let mx = z.x + Math.cos(ma) * 40, my = z.y + Math.sin(ma) * 40;
            let mhp = 3 + Math.floor(wave / 3);
            zombies.push({
              x: mx, y: my, radius: 14, speed: 1.2 + Math.random() * 0.5 + wave * 0.04,
              hp: mhp, maxHp: mhp, damage: 6 + Math.floor(wave / 3),
              hitFlash: 0, attackCooldown: 0,
              isBoss: false, bossCharging: false, chargeTimer: 0, chargeCooldown: 0,
              chargeVx: 0, chargeVy: 0,
              zombieType: 'runner', ghostPhase: 0, ghostSolid: true, necroTimer: 0,
              exploded: false, spitCooldown: 999,
              burnTimer: 0, burnDmg: 0, slowTimer: 0, slowFactor: 1
            });
            spawnParticles(mx, my, '#a0f', 5);
          }
          z.necroTimer = 140 + Math.floor(Math.random() * 80);
        }
      } else if (bid === 'hydra') {
        // Hydra: charges, splits into 2 mini-bosses at 50% HP
        if (z.bossCharging) {
          z.x += z.chargeVx; z.y += z.chargeVy;
          z.chargeTimer--;
          spawnParticles(z.x, z.y, '#4f4', 1);
          if (z.chargeTimer <= 0) { z.bossCharging = false; z.chargeCooldown = 100 + Math.floor(Math.random() * 40); }
        } else {
          z.chargeCooldown--;
          if (z.chargeCooldown <= 0) {
            let a = Math.atan2(player.y - z.y, player.x - z.x);
            z.chargeVx = Math.cos(a) * 5; z.chargeVy = Math.sin(a) * 5;
            z.chargeTimer = 25; z.bossCharging = true;
          } else {
            let a = Math.atan2(player.y - z.y, player.x - z.x);
            z.x += Math.cos(a) * effSpeed; z.y += Math.sin(a) * effSpeed;
          }
        }
        if (z.hydraPhase === 0 && z.hp <= z.maxHp * 0.5) {
          z.hydraPhase = 1;
          for (let h = 0; h < 2; h++) {
            let mhp = Math.floor(z.maxHp * 0.35);
            let off = h === 0 ? -30 : 30;
            zombies.push({
              x: z.x + off, y: z.y + off, radius: 28, speed: z.speed * 1.2,
              hp: mhp, maxHp: mhp, damage: Math.floor(z.damage * 0.7),
              hitFlash: 0, attackCooldown: 0,
              isBoss: true, bossCharging: false, chargeTimer: 0,
              chargeCooldown: 80 + Math.floor(Math.random() * 40),
              chargeVx: 0, chargeVy: 0,
              zombieType: 'boss', bossId: 'hydra_mini', ghostPhase: 0, ghostSolid: true,
              necroTimer: 0, exploded: false, spitCooldown: 999,
              fireTrailTimer: 0, frozenAuraTimer: 0, hydraPhase: 1,
              burnTimer: 0, burnDmg: 0, slowTimer: 0, slowFactor: 1
            });
          }
          spawnParticles(z.x, z.y, '#4f4', 20);
          addFloatingText(z.x, z.y - 30, 'SPLIT!', '#4f4');
        }
      } else {
        // hydra_mini or fallback: simple chase + charge
        if (z.bossCharging) {
          z.x += z.chargeVx; z.y += z.chargeVy;
          z.chargeTimer--;
          spawnParticles(z.x, z.y, '#4f4', 1);
          if (z.chargeTimer <= 0) { z.bossCharging = false; z.chargeCooldown = 80 + Math.floor(Math.random() * 40); }
        } else {
          z.chargeCooldown--;
          if (z.chargeCooldown <= 0) {
            let a = Math.atan2(player.y - z.y, player.x - z.x);
            z.chargeVx = Math.cos(a) * 5; z.chargeVy = Math.sin(a) * 5;
            z.chargeTimer = 20; z.bossCharging = true;
          } else {
            let a = Math.atan2(player.y - z.y, player.x - z.x);
            z.x += Math.cos(a) * effSpeed; z.y += Math.sin(a) * effSpeed;
          }
        }
      }
    } else if (z.zombieType === 'spitter') {
      if (z.aggro) {
        // Stay at range ~200px, shoot acid
        let distToPlayer = Math.hypot(z.x - player.x, z.y - player.y);
        let a = Math.atan2(player.y - z.y, player.x - z.x);
        if (distToPlayer > 220) {
          z.x += Math.cos(a) * effSpeed;
          z.y += Math.sin(a) * effSpeed;
        } else if (distToPlayer < 160) {
          z.x -= Math.cos(a) * effSpeed * 0.5;
          z.y -= Math.sin(a) * effSpeed * 0.5;
        }
        z.spitCooldown--;
        if (z.spitCooldown <= 0) {
          let ba = Math.atan2(player.y - z.y, player.x - z.x);
          acidBullets.push({
            x: z.x, y: z.y,
            vx: Math.cos(ba) * 3.5, vy: Math.sin(ba) * 3.5,
            damage: Math.max(3, Math.floor(z.damage * 0.5)),
            life: 90
          });
          z.spitCooldown = 80 + Math.floor(Math.random() * 40);
        }
      } else {
        if (!z.wanderAngle || Math.random() < 0.01) z.wanderAngle = Math.random() * Math.PI * 2;
        z.x += Math.cos(z.wanderAngle) * effSpeed * 0.3;
        z.y += Math.sin(z.wanderAngle) * effSpeed * 0.3;
      }
    } else if (z.zombieType === 'necromancer') {
      if (z.aggro) {
        // Stay at range, spawn walkers
        let distToPlayer = Math.hypot(z.x - player.x, z.y - player.y);
        let a = Math.atan2(player.y - z.y, player.x - z.x);
        if (distToPlayer > 280) {
          z.x += Math.cos(a) * effSpeed;
          z.y += Math.sin(a) * effSpeed;
        } else if (distToPlayer < 200) {
        z.x -= Math.cos(a) * effSpeed * 0.5;
        z.y -= Math.sin(a) * effSpeed * 0.5;
      }
      z.necroTimer--;
      if (z.necroTimer <= 0) {
        // Spawn a walker near the necromancer
        let sa = Math.random() * Math.PI * 2;
        let sx = z.x + Math.cos(sa) * 30;
        let sy = z.y + Math.sin(sa) * 30;
        let nhp = 2 + Math.floor(wave / 3);
        zombies.push({
          x: sx, y: sy, radius: 16, speed: 0.8 + Math.random() * 0.5 + wave * 0.05,
          hp: nhp, maxHp: nhp, damage: 8 + Math.floor(wave / 2),
          hitFlash: 0, attackCooldown: 0,
          isBoss: false, bossCharging: false, chargeTimer: 0, chargeCooldown: 0,
          chargeVx: 0, chargeVy: 0,
          zombieType: 'walker', ghostPhase: 0, ghostSolid: true, necroTimer: 0,
          exploded: false, spitCooldown: 999,
          burnTimer: 0, burnDmg: 0, slowTimer: 0, slowFactor: 1,
          aggro: !(CLASSES[selectedClass] && CLASSES[selectedClass].passive)
        });
        spawnParticles(sx, sy, '#808', 6);
        z.necroTimer = 200 + Math.floor(Math.random() * 100);
      }
      } else {
        if (!z.wanderAngle || Math.random() < 0.01) z.wanderAngle = Math.random() * Math.PI * 2;
        z.x += Math.cos(z.wanderAngle) * effSpeed * 0.3;
        z.y += Math.sin(z.wanderAngle) * effSpeed * 0.3;
      }
    } else if (z.zombieType === 'exploder') {
      if (z.aggro) {
        // Rush at player, explode on contact
        let a = Math.atan2(player.y - z.y, player.x - z.x);
        z.x += Math.cos(a) * effSpeed;
        z.y += Math.sin(a) * effSpeed;
      } else {
        if (!z.wanderAngle || Math.random() < 0.01) z.wanderAngle = Math.random() * Math.PI * 2;
        z.x += Math.cos(z.wanderAngle) * effSpeed * 0.3;
        z.y += Math.sin(z.wanderAngle) * effSpeed * 0.3;
      }
    } else {
      // Default movement (walker, runner, tank, splitter, mini, ghost)
      if (z.aggro) {
        let a = Math.atan2(player.y - z.y, player.x - z.x);
        z.x += Math.cos(a) * effSpeed;
        z.y += Math.sin(a) * effSpeed;
      } else {
        // Passive wander: drift slowly in a random direction
        if (!z.wanderAngle || Math.random() < 0.01) z.wanderAngle = Math.random() * Math.PI * 2;
        z.x += Math.cos(z.wanderAngle) * effSpeed * 0.3;
        z.y += Math.sin(z.wanderAngle) * effSpeed * 0.3;
        z.x = Math.max(z.radius, Math.min(CW - z.radius, z.x));
        z.y = Math.max(z.radius, Math.min(CH - z.radius, z.y));
      }
    }

    // Collision with player
    let dist = Math.hypot(z.x - player.x, z.y - player.y);
    if (dist < z.radius + player.radius && z.aggro) {
      // Exploder detonation
      if (z.zombieType === 'exploder' && !z.exploded) {
        z.exploded = true;
        z.hp = 0;
        let explodeDmg = Math.floor(z.damage * 1.5);
        if (player.iFrames <= 0) {
          let finalDmg = Math.max(1, Math.floor(explodeDmg * (1 - dmgReduction)));
          player.hp -= finalDmg;
          player.damageFlash = 10;
          player.iFrames = 30;
          stats.damageTaken += finalDmg;
          addFloatingText(player.x, player.y - 30, `-${finalDmg} 💥`, '#f84');
        }
        spawnParticles(z.x, z.y, '#f80', 20);
        spawnParticles(z.x, z.y, '#f44', 15);
        // AoE: also damage nearby zombies
        for (let oz of zombies) {
          if (oz === z) continue;
          if (Math.hypot(oz.x - z.x, oz.y - z.y) < 60) {
            oz.hp -= Math.floor(explodeDmg * 0.5);
            oz.hitFlash = 8;
          }
        }
        if (player.hp <= 0) {
          player.hp = 0;
          let waveSurvived = wave - 1;
          if (waveSurvived > highScore) {
            highScore = waveSurvived;
            localStorage.setItem('blobSurvivorHighScore', highScore.toString());
          }
          screen = 'dead';
          spawnParticles(player.x, player.y, '#f44', 30);
        }
      } else if (z.zombieType !== 'exploder') {
        // Ghost can't deal contact damage while transparent
        if (z.zombieType === 'ghost' && !z.ghostSolid) {
          // pass through
        } else {
          let a = Math.atan2(player.y - z.y, player.x - z.x);
          let overlap = z.radius + player.radius - dist;
          z.x -= Math.cos(a) * overlap * 0.5;
          z.y -= Math.sin(a) * overlap * 0.5;

          if (player.iFrames <= 0 && z.attackCooldown <= 0) {
            let rawDmg = z.isBoss && z.bossCharging ? Math.floor(z.damage * 1.5) : z.damage;
            let finalDmg = Math.max(1, Math.floor(rawDmg * (1 - dmgReduction)));
            player.hp -= finalDmg;
            player.iFrames = 30;
            player.damageFlash = 10;
            z.attackCooldown = 60;
            stats.damageTaken += finalDmg;
            addFloatingText(player.x, player.y - 30, `-${finalDmg}`, '#f44');
            spawnParticles(player.x, player.y, '#f44', 8);
            if (z.bossCharging) z.bossCharging = false;
            if (player.hp <= 0) {
              player.hp = 0;
              let waveSurvived = wave - 1;
              if (waveSurvived > highScore) {
                highScore = waveSurvived;
                localStorage.setItem('blobSurvivorHighScore', highScore.toString());
              }
              screen = 'dead';
              spawnParticles(player.x, player.y, '#f44', 30);
            }
          }
        }
      }
    }

    // Zombie-zombie separation (ghosts pass through)
    if (z.zombieType !== 'ghost') {
      for (let j = i + 1; j < zombies.length; j++) {
        let z2 = zombies[j];
        if (z2.zombieType === 'ghost') continue;
        let d = Math.hypot(z.x - z2.x, z.y - z2.y);
        if (d < z.radius + z2.radius && d > 0) {
          let sep = (z.radius + z2.radius - d) / 2;
          let ax = (z.x - z2.x) / d, ay = (z.y - z2.y) / d;
          z.x += ax * sep; z.y += ay * sep;
          z2.x -= ax * sep; z2.y -= ay * sep;
        }
      }
    }

    // Remove dead zombies
    if (z.hp <= 0) {
      let xpGain = z.isBoss ? 30 + wave * 5 : (z.zombieType === 'mini' ? 4 + wave : 8 + wave * 2);
      // Spawn XP orb instead of direct XP
      xpOrbs.push({ x: z.x, y: z.y, amount: xpGain, life: 600 });
      addFloatingText(z.x, z.y - 20, `+${xpGain} XP`, '#ff0');
      let zColor = getZombieColor(z);
      spawnParticles(z.x, z.y, z.isBoss ? '#a3f' : zColor, z.isBoss ? 25 : 12);
      score++;
      stats.kills++;
      if (z.isBoss) stats.bossesKilled++;

      // Splitter: spawn 2 mini zombies on death
      if (z.zombieType === 'splitter') {
        spawnMiniZombie(z.x, z.y, wave);
        spawnMiniZombie(z.x, z.y, wave);
      }

      zombies.splice(i, 1);
    }
  }

  // XP Orbs
  let magnetRange = UPGRADES.magnet.range[upgradeLevels.magnet];
  for (let i = xpOrbs.length - 1; i >= 0; i--) {
    let orb = xpOrbs[i];
    orb.life--;
    if (orb.life <= 0) { xpOrbs.splice(i, 1); continue; }
    let d = Math.hypot(orb.x - player.x, orb.y - player.y);
    if (d < magnetRange) {
      // Drift toward player
      let a = Math.atan2(player.y - orb.y, player.x - orb.x);
      let pullSpeed = 3 + (magnetRange - d) / magnetRange * 5;
      orb.x += Math.cos(a) * pullSpeed;
      orb.y += Math.sin(a) * pullSpeed;
    }
    // Collect on contact
    if (d < player.radius + 8) {
      xp += orb.amount;
      stats.xpCollected += orb.amount;
      // Level up check
      while (xp >= xpToNext) {
        xp -= xpToNext;
        level++;
        let reward = moneyForLevel(level);
        money += reward;
        stats.moneyEarned += reward;
        let crystalReward = crystalsForLevel(level);
        crystals += crystalReward;
        xpToNext = xpForLevel(level);
        addFloatingText(player.x, player.y - 50, `LEVEL ${level}! +$${reward} +💎${crystalReward}`, '#ff0');
        spawnParticles(player.x, player.y, '#ff0', 15);
        player.hp = Math.min(player.hp + 15, player.maxHp);
      }
      xpOrbs.splice(i, 1);
    }
  }

  // Gun auto-fire
  let gunLvl = upgradeLevels.gun;
  if (gunLvl > 0) {
    gunCooldown--;
    if (gunCooldown <= 0) {
      let gunRange = Math.floor(UPGRADES.gun.range[gunLvl] * cls.rangeMult);
      let closest = null, closestDist = Infinity;
      for (let z of zombies) {
        if (z.zombieType === 'ghost' && !z.ghostSolid) continue;
        let d = Math.hypot(z.x - player.x, z.y - player.y);
        if (d < gunRange && d < closestDist) {
          closest = z;
          closestDist = d;
        }
      }
      if (closest) {
        let a = Math.atan2(closest.y - player.y, closest.x - player.x);
        bullets.push({
          x: player.x, y: player.y,
          vx: Math.cos(a) * 8, vy: Math.sin(a) * 8,
          damage: Math.floor(UPGRADES.gun.damage[gunLvl] * cls.dmgMult),
          life: 60
        });
        gunCooldown = UPGRADES.gun.fireRate[gunLvl];
      }
    }
  }

  // Update bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    let b = bullets[i];
    b.x += b.vx; b.y += b.vy;
    b.life--;
    if (b.life <= 0 || b.x < 0 || b.x > CW || b.y < 0 || b.y > CH) {
      bullets.splice(i, 1);
      continue;
    }
    for (let j = zombies.length - 1; j >= 0; j--) {
      let z = zombies[j];
      if (z.zombieType === 'ghost' && !z.ghostSolid) continue;
      if (Math.hypot(b.x - z.x, b.y - z.y) < z.radius + 4) {
        z.hp -= b.damage;
        z.hitFlash = 6;
        stats.damageDealt += b.damage;
        spawnParticles(b.x, b.y, '#fa0', 3);
        bullets.splice(i, 1);
        break;
      }
    }
  }

  // Acid bullets (from spitters)
  for (let i = acidBullets.length - 1; i >= 0; i--) {
    let ab = acidBullets[i];
    ab.x += ab.vx; ab.y += ab.vy;
    ab.life--;
    if (ab.life <= 0 || ab.x < 0 || ab.x > CW || ab.y < 0 || ab.y > CH) {
      acidBullets.splice(i, 1);
      continue;
    }
    if (Math.hypot(ab.x - player.x, ab.y - player.y) < player.radius + 5) {
      if (player.iFrames <= 0) {
        let finalDmg = Math.max(1, Math.floor(ab.damage * (1 - dmgReduction)));
        player.hp -= finalDmg;
        player.iFrames = 20;
        player.damageFlash = 8;
        stats.damageTaken += finalDmg;
        addFloatingText(player.x, player.y - 30, `-${finalDmg} ☠`, '#a4f');
        spawnParticles(player.x, player.y, '#a4f', 5);
        if (player.hp <= 0) {
          player.hp = 0;
          let waveSurvived = wave - 1;
          if (waveSurvived > highScore) {
            highScore = waveSurvived;
            localStorage.setItem('blobSurvivorHighScore', highScore.toString());
          }
          screen = 'dead';
          spawnParticles(player.x, player.y, '#f44', 30);
        }
      }
      acidBullets.splice(i, 1);
    }
  }

  // ── Boomerang ──
  let boomLvl = upgradeLevels.boomerang;
  if (boomLvl > 0) {
    boomerangCooldown--;
    if (boomerangCooldown <= 0) {
      let boomRange = UPGRADES.boomerang.range[boomLvl];
      let closest = null, closestDist = Infinity;
      for (let z of zombies) {
        if (z.zombieType === 'ghost' && !z.ghostSolid) continue;
        let d = Math.hypot(z.x - player.x, z.y - player.y);
        if (d < boomRange * 2 && d < closestDist) { closest = z; closestDist = d; }
      }
      if (closest) {
        let a = Math.atan2(closest.y - player.y, closest.x - player.x);
        boomerangs.push({
          x: player.x, y: player.y, angle: a,
          distanceTraveled: 0, maxDist: boomRange,
          returning: false, originX: player.x, originY: player.y,
          speed: 6, damage: UPGRADES.boomerang.damage[boomLvl]
        });
        boomerangCooldown = UPGRADES.boomerang.fireRate[boomLvl];
      }
    }
  }
  for (let i = boomerangs.length - 1; i >= 0; i--) {
    let b = boomerangs[i];
    if (!b.returning) {
      b.x += Math.cos(b.angle) * b.speed;
      b.y += Math.sin(b.angle) * b.speed;
      b.distanceTraveled += b.speed;
      if (b.distanceTraveled >= b.maxDist) b.returning = true;
    } else {
      let a = Math.atan2(player.y - b.y, player.x - b.x);
      b.x += Math.cos(a) * b.speed;
      b.y += Math.sin(a) * b.speed;
      if (Math.hypot(b.x - player.x, b.y - player.y) < player.radius + 10) {
        boomerangs.splice(i, 1); continue;
      }
    }
    if (b.x < -50 || b.x > CW+50 || b.y < -50 || b.y > CH+50) { boomerangs.splice(i, 1); continue; }
    for (let z of zombies) {
      if (z.zombieType === 'ghost' && !z.ghostSolid) continue;
      if (z.hitFlash > 0) continue;
      if (Math.hypot(b.x - z.x, b.y - z.y) < z.radius + 8) {
        z.hp -= b.damage; z.hitFlash = 8;
        stats.damageDealt += b.damage;
        spawnParticles(z.x, z.y, '#8cf', 3);
      }
    }
  }

  // ── Lightning Chain ──
  let ltLvl = upgradeLevels.lightning;
  if (ltLvl > 0) {
    lightningCooldown--;
    if (lightningCooldown <= 0) {
      let ltRange = UPGRADES.lightning.chainRange[ltLvl] * 3;
      let closest = null, closestDist = Infinity;
      for (let z of zombies) {
        if (z.zombieType === 'ghost' && !z.ghostSolid) continue;
        let d = Math.hypot(z.x - player.x, z.y - player.y);
        if (d < ltRange && d < closestDist) { closest = z; closestDist = d; }
      }
      if (closest) {
        let ltDmg = UPGRADES.lightning.damage[ltLvl];
        let chains = UPGRADES.lightning.chainCount[ltLvl];
        let chainR = UPGRADES.lightning.chainRange[ltLvl];
        let hitSet = new Set();
        let current = closest;
        let points = [[player.x, player.y]];
        for (let c = 0; c <= chains && current; c++) {
          current.hp -= ltDmg; current.hitFlash = 8;
          stats.damageDealt += ltDmg;
          hitSet.add(current);
          points.push([current.x, current.y]);
          spawnParticles(current.x, current.y, '#ff0', 3);
          let next = null, nextD = Infinity;
          for (let z of zombies) {
            if (hitSet.has(z)) continue;
            if (z.zombieType === 'ghost' && !z.ghostSolid) continue;
            let d = Math.hypot(z.x - current.x, z.y - current.y);
            if (d < chainR && d < nextD) { next = z; nextD = d; }
          }
          current = next;
        }
        lightningEffects.push({ points, life: 10 });
        lightningCooldown = UPGRADES.lightning.fireRate[ltLvl];
      }
    }
  }
  for (let i = lightningEffects.length - 1; i >= 0; i--) {
    lightningEffects[i].life--;
    if (lightningEffects[i].life <= 0) lightningEffects.splice(i, 1);
  }

  // ── Orbital Shield ──
  let orbLvl = upgradeLevels.orbital;
  if (orbLvl > 0) {
    orbitalAngle += 0.04;
    let orbCount = UPGRADES.orbital.orbCount[orbLvl];
    let orbDmg = UPGRADES.orbital.damage[orbLvl];
    let orbR = UPGRADES.orbital.orbRadius[orbLvl];
    for (let o = 0; o < orbCount; o++) {
      let oa = orbitalAngle + o * (Math.PI * 2 / orbCount);
      let ox = player.x + Math.cos(oa) * orbR;
      let oy = player.y + Math.sin(oa) * orbR;
      for (let z of zombies) {
        if (z.zombieType === 'ghost' && !z.ghostSolid) continue;
        if (z.hitFlash > 0) continue;
        if (Math.hypot(ox - z.x, oy - z.y) < z.radius + 8) {
          z.hp -= orbDmg; z.hitFlash = 10;
          stats.damageDealt += orbDmg;
          spawnParticles(z.x, z.y, '#48f', 3);
        }
      }
    }
  }

  // ── Flamethrower ──
  let flameLvl = upgradeLevels.flamethrower;
  if (flameLvl > 0) {
    flameCooldown--;
    if (flameCooldown <= 0) {
      let flameRange = UPGRADES.flamethrower.range[flameLvl];
      let flameDmg = UPGRADES.flamethrower.damage[flameLvl];
      let burnDur = UPGRADES.flamethrower.burnDuration[flameLvl];
      let hitAny = false;
      for (let z of zombies) {
        if (z.zombieType === 'ghost' && !z.ghostSolid) continue;
        let d = Math.hypot(z.x - player.x, z.y - player.y);
        if (d < flameRange + z.radius) {
          let toZ = Math.atan2(z.y - player.y, z.x - player.x);
          let aDiff = Math.abs(angleDelta(player.angle, toZ));
          if (aDiff < Math.PI / 6) {
            z.burnTimer = burnDur;
            z.burnDmg = flameDmg;
            z.hitFlash = 4;
            hitAny = true;
          }
        }
      }
      if (hitAny) {
        flameCooldown = UPGRADES.flamethrower.fireRate[flameLvl];
        for (let fp = 0; fp < 5; fp++) {
          let fa = player.angle + (Math.random() - 0.5) * (Math.PI / 3);
          let fd = 20 + Math.random() * flameRange * 0.8;
          spawnParticles(player.x + Math.cos(fa) * fd, player.y + Math.sin(fa) * fd, Math.random() > 0.5 ? '#f60' : '#fa0', 1);
        }
      }
    }
  }

  // ── Freeze Ray ──
  let frzLvl = upgradeLevels.freeze;
  if (frzLvl > 0) {
    freezeCooldown--;
    if (freezeCooldown <= 0) {
      let frzRange = UPGRADES.freeze.range[frzLvl];
      let frzSlow = UPGRADES.freeze.slowFactor[frzLvl];
      let frzDur = UPGRADES.freeze.duration[frzLvl];
      let hitAny = false;
      for (let z of zombies) {
        if (z.zombieType === 'ghost' && !z.ghostSolid) continue;
        let d = Math.hypot(z.x - player.x, z.y - player.y);
        if (d < frzRange + z.radius) {
          let toZ = Math.atan2(z.y - player.y, z.x - player.x);
          let aDiff = Math.abs(angleDelta(player.angle, toZ));
          if (aDiff < Math.PI / 12) {
            z.slowTimer = frzDur;
            z.slowFactor = frzSlow;
            hitAny = true;
          }
        }
      }
      if (hitAny) {
        freezeCooldown = UPGRADES.freeze.fireRate[frzLvl];
        freezeBeamTimer = 10;
        freezeBeamAngle = player.angle;
      }
    }
  }
  if (freezeBeamTimer > 0) freezeBeamTimer--;

  // ── Poison Cloud ──
  let poisLvl = upgradeLevels.poison;
  if (poisLvl > 0) {
    poisonCooldown--;
    if (poisonCooldown <= 0) {
      poisonClouds.push({
        x: player.x, y: player.y,
        radius: UPGRADES.poison.radius[poisLvl],
        damage: UPGRADES.poison.damage[poisLvl],
        life: UPGRADES.poison.duration[poisLvl],
        maxLife: UPGRADES.poison.duration[poisLvl],
        tickCounter: 0
      });
      poisonCooldown = UPGRADES.poison.fireRate[poisLvl];
    }
  }
  for (let i = poisonClouds.length - 1; i >= 0; i--) {
    let pc = poisonClouds[i];
    pc.life--;
    pc.tickCounter++;
    if (pc.life <= 0) { poisonClouds.splice(i, 1); continue; }
    if (pc.tickCounter % 20 === 0) {
      for (let z of zombies) {
        if (z.zombieType === 'ghost' && !z.ghostSolid) continue;
        if (Math.hypot(z.x - pc.x, z.y - pc.y) < pc.radius + z.radius) {
          z.hp -= pc.damage; z.hitFlash = 4;
          stats.damageDealt += pc.damage;
        }
      }
    }
  }

  // Next wave
  if (zombies.length === 0 && zombiesLeft <= 0) {
    bossSpawned = false;
    nextWave();
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.95; p.vy *= 0.95;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Floating texts
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    let ft = floatingTexts[i];
    ft.y -= 0.8;
    ft.life--;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }
}

function getZombieColor(z) {
  if (z.isBoss) {
    let bid = z.bossId || 'brute';
    switch(bid) {
      case 'brute': return '#6a2e8a';
      case 'inferno': return '#a02000';
      case 'frost_titan': return '#1a5080';
      case 'necro_lord': return '#3a0050';
      case 'hydra': return '#206830';
      case 'hydra_mini': return '#308040';
      default: return '#6a2e8a';
    }
  }
  switch(z.zombieType) {
    case 'runner': return '#cc4';
    case 'tank': return '#8b2020';
    case 'spitter': return '#9040c0';
    case 'splitter': return '#60d060';
    case 'exploder': return '#e06020';
    case 'ghost': return '#dde';
    case 'necromancer': return '#502080';
    case 'mini': return '#70c070';
    default: return '#3a7a3a';
  }
}

// ── Draw ───────────────────────────────────────────────
function draw() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, CW, CH);

  if (screen === 'title') { drawTitle(); return; }
  if (screen === 'classSelect') { drawClassSelect(); return; }
  if (screen === 'shop') { drawShop(); return; }
  if (screen === 'crystalShop') { drawCrystalShop(); return; }

  drawArena();

  if (screen === 'dead') drawDeathScreen();
}

function drawGrid() {
  ctx.strokeStyle = '#222240';
  ctx.lineWidth = 1;
  for (let x = 0; x < CW; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,CH); ctx.stroke(); }
  for (let y = 0; y < CH; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(CW,y); ctx.stroke(); }
}

function drawTitle() {
  drawGrid();

  // Decorative zombies in background
  let t = titlePulse;
  for (let i = 0; i < 8; i++) {
    let a = (Math.PI * 2 / 8) * i + t * 0.3;
    let zx = CW/2 + Math.cos(a) * 200;
    let zy = CH/2 + Math.sin(a) * 150;
    ctx.fillStyle = '#3a7a3a';
    ctx.globalAlpha = 0.4;
    ctx.beginPath(); ctx.arc(zx, zy, 18, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#c00';
    ctx.beginPath(); ctx.arc(zx-5, zy-3, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(zx+5, zy-3, 3, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Title
  ctx.textAlign = 'center';
  ctx.fillStyle = '#5599ee';
  ctx.font = 'bold 60px monospace';
  ctx.fillText('WOBBLE WARFARE', CW/2, CH/2 - 80);

  // Subtitle with sword
  ctx.fillStyle = '#aaa';
  ctx.font = '18px monospace';
  ctx.fillText('⚔️  Survive the zombie horde  ⚔️', CW/2, CH/2 - 40);

  // High score
  if (highScore > 0) {
    ctx.fillStyle = '#ff0';
    ctx.font = 'bold 16px monospace';
    ctx.fillText(`🏆 Best: Wave ${highScore}`, CW/2, CH/2);
  }

  // Start prompt
  let pulse = 0.6 + Math.sin(titlePulse * 2) * 0.4;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 24px monospace';
  ctx.fillText('CLICK TO START', CW/2, CH/2 + 60);
  ctx.globalAlpha = 1;

  // Controls
  ctx.fillStyle = '#666';
  ctx.font = '13px monospace';
  ctx.fillText('WASD to move  •  Mouse to aim  •  Space to slash  •  Shift to dash', CW/2, CH/2 + 120);
  ctx.fillText('Q for shockwave  •  B for shop  •  C for crystal shop', CW/2, CH/2 + 140);
}

function drawClassSelect() {
  drawGrid();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#5599ee';
  ctx.font = 'bold 40px monospace';
  ctx.fillText('CHOOSE YOUR CLASS', CW/2, 100);
  ctx.fillStyle = '#888';
  ctx.font = '14px monospace';
  ctx.fillText('Click a class to begin', CW/2, 130);

  let classKeys = Object.keys(CLASSES);
  let startX = CW/2 - (classKeys.length * 140) / 2 + 70;

  for (let i = 0; i < classKeys.length; i++) {
    let key = classKeys[i];
    let c = CLASSES[key];
    let cx = startX + i * 140;
    let cy = CH/2 + 20;
    let hovered = Math.abs(mouse.x - cx) < 65 && Math.abs(mouse.y - cy) < 80;

    // Card background
    ctx.fillStyle = hovered ? '#2a2a4e' : '#1e1e3a';
    ctx.strokeStyle = hovered ? c.color : '#444';
    ctx.lineWidth = hovered ? 3 : 1;
    roundRect(cx - 65, cy - 65, 130, 150, 8);
    ctx.fill();
    ctx.stroke();

    // Icon
    ctx.font = '36px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText(c.icon, cx, cy - 20);

    // Name
    ctx.font = 'bold 14px monospace';
    ctx.fillStyle = c.color;
    ctx.fillText(c.name, cx, cy + 15);

    // Description — word-wrap within card
    ctx.font = '9px monospace';
    ctx.fillStyle = '#aaa';
    let maxW = 115;
    let descWords = c.desc.split(' ');
    let lines = [];
    let curLine = '';
    for (let dw of descWords) {
      let test = curLine ? curLine + ' ' + dw : dw;
      if (ctx.measureText(test).width > maxW && curLine) {
        lines.push(curLine);
        curLine = dw;
      } else {
        curLine = test;
      }
    }
    if (curLine) lines.push(curLine);
    for (let li = 0; li < lines.length; li++) {
      ctx.fillText(lines[li], cx, cy + 33 + li * 11);
    }
  }
}

function drawCrystalShop() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, CW, CH);
  drawGrid();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#8cf';
  ctx.font = 'bold 32px monospace';
  ctx.fillText('💎 CRYSTAL UPGRADES', CW/2, 60);

  ctx.fillStyle = '#4ef';
  ctx.font = '16px monospace';
  ctx.fillText(`Crystals: 💎 ${crystals}`, CW/2, 90);

  ctx.fillStyle = '#666';
  ctx.font = '12px monospace';
  ctx.fillText(isMobile ? 'Tap bottom to close' : 'Press C or ESC to close', CW/2, 110);

  let cKeys = Object.keys(CRYSTAL_UPGRADES);
  let startY = 150;
  let itemSpacing = 80;

  for (let i = 0; i < cKeys.length; i++) {
    let key = cKeys[i];
    let up = CRYSTAL_UPGRADES[key];
    let lvl = crystalUpgradeLevels[key];
    let iy = startY + i * itemSpacing;
    let selected = i === crystalShopSelection;

    ctx.fillStyle = selected ? '#2a2a5a' : '#1a1a3a';
    ctx.strokeStyle = selected ? '#4ef' : '#333';
    ctx.lineWidth = selected ? 2 : 1;
    roundRect(CW/2 - 250, iy, 500, 65, 6);
    ctx.fill();
    ctx.stroke();

    ctx.textAlign = 'left';
    ctx.font = 'bold 18px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText(`${up.icon} ${up.name}`, CW/2 - 230, iy + 25);

    ctx.font = '12px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText(up.desc(lvl), CW/2 - 230, iy + 45);

    ctx.textAlign = 'right';
    ctx.font = '14px monospace';
    if (lvl >= up.maxLevel) {
      ctx.fillStyle = '#4f4';
      ctx.fillText('MAX', CW/2 + 230, iy + 25);
    } else {
      let cost = up.costs[lvl];
      ctx.fillStyle = crystals >= cost ? '#4ef' : '#f44';
      ctx.fillText(`💎 ${cost}`, CW/2 + 230, iy + 25);
    }
    // Level bar
    ctx.fillStyle = '#333';
    roundRect(CW/2 + 100, iy + 38, 130, 10, 3);
    ctx.fill();
    ctx.fillStyle = '#4ef';
    roundRect(CW/2 + 100, iy + 38, 130 * (lvl / up.maxLevel), 10, 3);
    ctx.fill();
    ctx.textAlign = 'center';
    ctx.font = '9px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText(`${lvl}/${up.maxLevel}`, CW/2 + 165, iy + 47);
  }
  // Close button for mobile
  if (isMobile) {
    ctx.fillStyle = '#333';
    roundRect(CW/2 - 80, CH - 55, 160, 40, 8);
    ctx.fill();
    ctx.strokeStyle = '#4ef';
    ctx.lineWidth = 1;
    roundRect(CW/2 - 80, CH - 55, 160, 40, 8);
    ctx.stroke();
    ctx.font = 'bold 14px monospace';
    ctx.fillStyle = '#4ef';
    ctx.fillText('✕ CLOSE', CW/2, CH - 30);
  }
  ctx.textAlign = 'center';
}

function drawArena() {
  drawGrid();

  // Shockwave effect
  if (shockwaveEffect > 0) {
    let progress = 1 - shockwaveEffect / 20;
    let r = SHOCKWAVE_RADIUS * progress;
    ctx.globalAlpha = shockwaveEffect / 20 * 0.5;
    ctx.strokeStyle = '#4af';
    ctx.lineWidth = 4 - progress * 3;
    ctx.beginPath(); ctx.arc(player.x, player.y, r, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = shockwaveEffect / 20 * 0.15;
    ctx.fillStyle = '#4af';
    ctx.beginPath(); ctx.arc(player.x, player.y, r, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Particles
  for (let p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // XP Orbs
  for (let orb of xpOrbs) {
    let orbAlpha = Math.min(1, orb.life / 60);
    ctx.globalAlpha = orbAlpha * 0.8;
    ctx.fillStyle = '#ff0';
    ctx.shadowColor = '#ff0';
    ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(orb.x, orb.y, 5, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = orbAlpha * 0.4;
    ctx.fillStyle = '#ffa';
    ctx.beginPath(); ctx.arc(orb.x, orb.y, 3, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Gun range indicator
  if (upgradeLevels.gun > 0) {
    let gunRange = UPGRADES.gun.range[upgradeLevels.gun];
    ctx.globalAlpha = 0.08;
    ctx.strokeStyle = '#f84';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(player.x, player.y, gunRange, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  // Bullets
  for (let b of bullets) {
    ctx.fillStyle = '#fa0';
    ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff0';
    ctx.beginPath(); ctx.arc(b.x, b.y, 2, 0, Math.PI*2); ctx.fill();
  }

  // Acid bullets
  for (let ab of acidBullets) {
    ctx.fillStyle = '#a4f';
    ctx.beginPath(); ctx.arc(ab.x, ab.y, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#c8f';
    ctx.beginPath(); ctx.arc(ab.x, ab.y, 3, 0, Math.PI*2); ctx.fill();
  }

  // Zombies
  for (let z of zombies) {
    // Boss aura
    if (z.isBoss) {
      let bid = z.bossId || 'brute';
      let auraC = bid === 'inferno' ? '#f60' : bid === 'frost_titan' ? '#4cf' : bid === 'necro_lord' ? '#a0f' : bid === 'hydra' || bid === 'hydra_mini' ? '#4f4' : '#a3f';
      ctx.globalAlpha = 0.2 + Math.sin(titlePulse * 3) * 0.1;
      ctx.fillStyle = auraC;
      ctx.beginPath(); ctx.arc(z.x, z.y, z.radius + 10, 0, Math.PI*2); ctx.fill();
      // Frost Titan extra ring
      if (bid === 'frost_titan') {
        ctx.globalAlpha = 0.08 + Math.sin(titlePulse * 2) * 0.04;
        ctx.strokeStyle = '#4cf';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(z.x, z.y, 160, 0, Math.PI*2); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // Ghost transparency
    if (z.zombieType === 'ghost') {
      ctx.globalAlpha = z.ghostSolid ? 0.9 : 0.25;
    }

    // Exploder pulsing aura
    if (z.zombieType === 'exploder') {
      let pulse = 0.3 + Math.sin(titlePulse * 6) * 0.2;
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#f44';
      ctx.beginPath(); ctx.arc(z.x, z.y, z.radius + 6, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Necromancer aura
    if (z.zombieType === 'necromancer') {
      ctx.globalAlpha = 0.15 + Math.sin(titlePulse * 2) * 0.1;
      ctx.fillStyle = '#808';
      ctx.beginPath(); ctx.arc(z.x, z.y, z.radius + 8, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = z.zombieType === 'ghost' ? (z.ghostSolid ? 0.9 : 0.25) : 1;
    }

    // Body
    let baseColor = getZombieColor(z);
    ctx.fillStyle = z.hitFlash > 0 ? '#fff' : baseColor;
    ctx.beginPath(); ctx.arc(z.x, z.y, z.radius, 0, Math.PI*2); ctx.fill();

    // Eyes
    let eyeA = Math.atan2(player.y - z.y, player.x - z.x);
    let eyeSize = z.isBoss ? 5 : (z.zombieType === 'mini' ? 2 : 3);
    let eyeColor;
    if (z.isBoss) {
      let bid = z.bossId || 'brute';
      eyeColor = bid === 'inferno' ? '#ff0' : bid === 'frost_titan' ? '#aef' : bid === 'necro_lord' ? '#f0f' : bid === 'hydra' || bid === 'hydra_mini' ? '#8f8' : '#f0f';
    } else {
      eyeColor = z.zombieType === 'ghost' ? '#88f' : (z.zombieType === 'necromancer' ? '#f0f' : '#c00');
    }
    for (let side of [-0.4, 0.4]) {
      let ex = z.x + Math.cos(eyeA + side) * z.radius * 0.5;
      let ey = z.y + Math.sin(eyeA + side) * z.radius * 0.5;
      ctx.fillStyle = eyeColor;
      ctx.beginPath(); ctx.arc(ex, ey, eyeSize, 0, Math.PI*2); ctx.fill();
    }

    // Boss weapon
    if (z.isBoss) {
      let bid = z.bossId || 'brute';
      ctx.save();
      ctx.translate(z.x, z.y);
      if (bid === 'brute') {
        // Mace
        let wAngle = eyeA + (z.bossCharging ? 0 : Math.sin(titlePulse * 4) * 0.3);
        ctx.rotate(wAngle);
        ctx.strokeStyle = '#654'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(z.radius, 0); ctx.lineTo(z.radius + 30, 0); ctx.stroke();
        ctx.fillStyle = z.bossCharging ? '#f44' : '#888';
        ctx.beginPath(); ctx.arc(z.radius + 34, 0, 8, 0, Math.PI*2); ctx.fill();
        for (let s = 0; s < 6; s++) {
          let sa = (Math.PI*2/6)*s;
          ctx.fillStyle = '#aaa';
          ctx.beginPath(); ctx.arc(z.radius+34 + Math.cos(sa)*10, Math.sin(sa)*10, 2, 0, Math.PI*2); ctx.fill();
        }
      } else if (bid === 'inferno') {
        // Flaming fists
        ctx.rotate(eyeA);
        for (let side of [-0.6, 0.6]) {
          let fx = z.radius * Math.cos(side), fy = z.radius * Math.sin(side);
          ctx.fillStyle = '#f80';
          ctx.beginPath(); ctx.arc(fx + 10, fy, 7, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#ff0';
          ctx.beginPath(); ctx.arc(fx + 10, fy, 4 + Math.sin(titlePulse * 8) * 2, 0, Math.PI*2); ctx.fill();
        }
      } else if (bid === 'frost_titan') {
        // Ice crystal crown
        for (let c = 0; c < 5; c++) {
          let ca = (Math.PI*2/5)*c + titlePulse * 0.5;
          let cx = Math.cos(ca) * (z.radius + 8), cy = Math.sin(ca) * (z.radius + 8);
          ctx.fillStyle = '#8df';
          ctx.beginPath(); ctx.moveTo(cx, cy - 8); ctx.lineTo(cx - 4, cy + 4); ctx.lineTo(cx + 4, cy + 4); ctx.closePath(); ctx.fill();
        }
      } else if (bid === 'necro_lord') {
        // Skull staff
        let wAngle = eyeA + Math.sin(titlePulse * 2) * 0.2;
        ctx.rotate(wAngle);
        ctx.strokeStyle = '#432'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(z.radius, 0); ctx.lineTo(z.radius + 28, 0); ctx.stroke();
        ctx.fillStyle = '#ddd';
        ctx.beginPath(); ctx.arc(z.radius + 30, 0, 6, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#f0f';
        ctx.beginPath(); ctx.arc(z.radius + 28, -2, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(z.radius + 32, -2, 2, 0, Math.PI*2); ctx.fill();
      } else if (bid === 'hydra' || bid === 'hydra_mini') {
        // Multiple heads (tendrils)
        let headCount = bid === 'hydra' ? 3 : 2;
        for (let h = 0; h < headCount; h++) {
          let ha = eyeA + (h - (headCount-1)/2) * 0.5 + Math.sin(titlePulse * 3 + h) * 0.15;
          ctx.strokeStyle = '#3a5'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(Math.cos(ha)*z.radius, Math.sin(ha)*z.radius);
          ctx.lineTo(Math.cos(ha)*(z.radius+22), Math.sin(ha)*(z.radius+22)); ctx.stroke();
          ctx.fillStyle = '#4f4';
          ctx.beginPath(); ctx.arc(Math.cos(ha)*(z.radius+24), Math.sin(ha)*(z.radius+24), 5, 0, Math.PI*2); ctx.fill();
        }
      }
      ctx.restore();
    }

    // Necromancer staff
    if (z.zombieType === 'necromancer') {
      ctx.save();
      ctx.translate(z.x, z.y);
      ctx.rotate(eyeA);
      ctx.strokeStyle = '#543';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(z.radius, 0); ctx.lineTo(z.radius + 20, 0); ctx.stroke();
      ctx.fillStyle = '#f0f';
      ctx.beginPath(); ctx.arc(z.radius + 22, 0, 4, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    // HP bar
    if (z.hp < z.maxHp) {
      let bw = z.radius * 2, bh = z.isBoss ? 6 : 4;
      let bx = z.x - bw/2, by = z.y - z.radius - (z.isBoss ? 16 : 10);
      ctx.fillStyle = '#600';
      ctx.fillRect(bx, by, bw, bh);
      let hpColor = z.isBoss ? (z.bossId === 'inferno' ? '#f80' : z.bossId === 'frost_titan' ? '#4cf' : z.bossId === 'necro_lord' ? '#a0f' : z.bossId === 'hydra' || z.bossId === 'hydra_mini' ? '#4f4' : '#f4f') : (z.zombieType === 'tank' ? '#f88' : '#f44');
      ctx.fillStyle = hpColor;
      ctx.fillRect(bx, by, bw * (z.hp / z.maxHp), bh);
    }
    // Boss label
    if (z.isBoss) {
      ctx.textAlign = 'center';
      ctx.font = 'bold 11px monospace';
      ctx.fillStyle = '#f4f';
      ctx.fillText('BOSS', z.x, z.y - z.radius - 20);
    }

    // Reset alpha after ghost
    if (z.zombieType === 'ghost') {
      ctx.globalAlpha = 1;
    }
  }

  // Player (blink when invincible)
  let blink = player.iFrames > 0 && Math.floor(player.iFrames / 3) % 2;
  if (!blink) {
    // Shield aura
    if (upgradeLevels.shield > 0) {
      ctx.globalAlpha = 0.15 + upgradeLevels.shield * 0.05;
      ctx.strokeStyle = '#68f';
      ctx.lineWidth = 2 + upgradeLevels.shield;
      ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 6, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Dash visual
    if (dashTimer > 0) {
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = '#4af';
      ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 4, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = player.damageFlash > 0 ? '#f88' : '#5599ee';
    ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2); ctx.fill();

    for (let side of [-0.35, 0.35]) {
      let ex = player.x + Math.cos(player.angle + side) * player.radius * 0.45;
      let ey = player.y + Math.sin(player.angle + side) * player.radius * 0.45;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex, ey, 4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#112';
      ctx.beginPath();
      ctx.arc(ex + Math.cos(player.angle)*1.5, ey + Math.sin(player.angle)*1.5, 2, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // Sword / Axe
  let swordLen = UPGRADES.sword.length[upgradeLevels.sword];
  let swordColor = ['#dde','#cef','#aff','#8ff','#ff0','#f80','#f44','#f0f','#4ff','#fff','#ffd700'][upgradeLevels.sword];
  let drawCls = CLASSES[selectedClass] || CLASSES.tank;
  if (drawCls.hasAxe) {
    // Draw Viking Axe
    if (axeSwinging) {
      let progress = 1 - axeSwingTimer / AXE_SWING_DURATION;
      let aAngle = player.angle - Math.PI*0.6 + Math.PI*1.2 * progress;
      drawAxe(aAngle, 1);
      for (let t = 0; t < 3; t++) {
        let tp = Math.max(0, progress - t * 0.06);
        let ta = player.angle - Math.PI*0.6 + Math.PI*1.2 * tp;
        ctx.globalAlpha = 0.12 - t * 0.03;
        drawAxe(ta, 0.7);
      }
      ctx.globalAlpha = 1;
    } else {
      drawAxe(player.angle, axeCooldown > 0 ? 0.5 : 1);
    }
  } else if (swinging) {
    let progress = 1 - swingTimer / SWING_DURATION;
    let sAngle = player.angle - SWORD_ARC/2 + SWORD_ARC * progress;
    drawSword(sAngle, 1, swordLen, swordColor);
    for (let t = 0; t < 4; t++) {
      let tp = Math.max(0, progress - t * 0.08);
      let ta = player.angle - SWORD_ARC/2 + SWORD_ARC * tp;
      ctx.globalAlpha = 0.15 - t * 0.03;
      drawSword(ta, 0.7, swordLen, swordColor);
    }
    ctx.globalAlpha = 1;
  } else {
    drawSword(player.angle, 1, swordLen, swordColor);
  }

  // ── Draw Boomerangs ──
  for (let b of boomerangs) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(titlePulse * 8);
    ctx.fillStyle = '#8cf';
    ctx.beginPath();
    ctx.arc(0, 0, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#5af';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 7, 0, Math.PI);
    ctx.stroke();
    ctx.restore();
  }

  // ── Draw Lightning Effects ──
  for (let le of lightningEffects) {
    ctx.globalAlpha = le.life / 10;
    ctx.strokeStyle = '#ff0';
    ctx.lineWidth = 2;
    for (let p = 0; p < le.points.length - 1; p++) {
      let [x1, y1] = le.points[p];
      let [x2, y2] = le.points[p + 1];
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      let segs = 4;
      let dx = (x2 - x1) / segs, dy = (y2 - y1) / segs;
      let perpX = -dy, perpY = dx;
      let pLen = Math.sqrt(perpX*perpX + perpY*perpY) || 1;
      perpX /= pLen; perpY /= pLen;
      for (let s = 1; s < segs; s++) {
        let off = (Math.random() - 0.5) * 20;
        ctx.lineTo(x1 + dx*s + perpX*off, y1 + dy*s + perpY*off);
      }
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
    // Glow
    ctx.strokeStyle = '#ffa';
    ctx.lineWidth = 4;
    ctx.globalAlpha *= 0.3;
    for (let p = 0; p < le.points.length - 1; p++) {
      ctx.beginPath();
      ctx.moveTo(le.points[p][0], le.points[p][1]);
      ctx.lineTo(le.points[p+1][0], le.points[p+1][1]);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  // ── Draw Orbital Shield ──
  if (upgradeLevels.orbital > 0) {
    let orbCount = UPGRADES.orbital.orbCount[upgradeLevels.orbital];
    let orbR = UPGRADES.orbital.orbRadius[upgradeLevels.orbital];
    for (let o = 0; o < orbCount; o++) {
      let oa = orbitalAngle + o * (Math.PI * 2 / orbCount);
      let ox = player.x + Math.cos(oa) * orbR;
      let oy = player.y + Math.sin(oa) * orbR;
      ctx.fillStyle = '#48f';
      ctx.shadowColor = '#48f';
      ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(ox, oy, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8bf';
      ctx.beginPath(); ctx.arc(ox, oy, 4, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  // ── Draw Flamethrower Cone ──
  if (upgradeLevels.flamethrower > 0 && flameCooldown > UPGRADES.flamethrower.fireRate[upgradeLevels.flamethrower] - 5) {
    let flameRange = UPGRADES.flamethrower.range[upgradeLevels.flamethrower];
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#f60';
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.arc(player.x, player.y, flameRange, player.angle - Math.PI/6, player.angle + Math.PI/6);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // ── Draw Freeze Beam ──
  if (freezeBeamTimer > 0) {
    let frzRange = UPGRADES.freeze.range[upgradeLevels.freeze];
    ctx.globalAlpha = freezeBeamTimer / 10 * 0.6;
    ctx.strokeStyle = '#4ef';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.lineTo(player.x + Math.cos(freezeBeamAngle) * frzRange, player.y + Math.sin(freezeBeamAngle) * frzRange);
    ctx.stroke();
    ctx.strokeStyle = '#aff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.lineTo(player.x + Math.cos(freezeBeamAngle) * frzRange, player.y + Math.sin(freezeBeamAngle) * frzRange);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ── Draw Poison Clouds ──
  for (let pc of poisonClouds) {
    let alpha = Math.min(0.35, pc.life / pc.maxLife * 0.4);
    let pulse = 1 + Math.sin(titlePulse * 4 + pc.x) * 0.1;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#4a2';
    ctx.beginPath(); ctx.arc(pc.x, pc.y, pc.radius * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = alpha * 0.6;
    ctx.fillStyle = '#6c4';
    ctx.beginPath(); ctx.arc(pc.x, pc.y, pc.radius * 0.6 * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Floating texts
  for (let ft of floatingTexts) {
    ctx.globalAlpha = ft.life / ft.maxLife;
    ctx.textAlign = 'center';
    ctx.font = 'bold 14px monospace';
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, ft.x, ft.y);
  }
  ctx.globalAlpha = 1;

  // ── HUD ──
  // HP Bar
  let hpBarW = 200, hpBarH = 18, hpX = 20, hpY = 20;
  ctx.fillStyle = '#333';
  roundRect(hpX, hpY, hpBarW, hpBarH, 4);
  let hpRatio = Math.max(0, player.hp / player.maxHp);
  ctx.fillStyle = hpRatio > 0.5 ? '#4c4' : hpRatio > 0.25 ? '#ca4' : '#c44';
  roundRect(hpX, hpY, hpBarW * hpRatio, hpBarH, 4);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`HP: ${player.hp} / ${player.maxHp}`, hpX + hpBarW/2, hpY + 14);

  // XP Bar
  let xpBarW = 200, xpBarH = 10, xpX = 20, xpY = 44;
  ctx.fillStyle = '#333';
  roundRect(xpX, xpY, xpBarW, xpBarH, 3);
  ctx.fillStyle = '#66f';
  roundRect(xpX, xpY, xpBarW * (xp / xpToNext), xpBarH, 3);
  ctx.fillStyle = '#aaf';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`LVL ${level}  (${xp}/${xpToNext} XP)`, xpX + xpBarW/2, xpY + 9);

  // Money & Crystals
  ctx.textAlign = 'left';
  ctx.font = 'bold 14px monospace';
  ctx.fillStyle = '#fd0';
  ctx.fillText(`💰 $${money}`, 20, 72);
  ctx.fillStyle = '#4ef';
  ctx.fillText(`💎 ${crystals}`, 120, 72);

  // Dash cooldown indicator
  let cdY = 88;
  ctx.font = '11px monospace';
  if (dashCooldown > 0) {
    ctx.fillStyle = '#888';
    ctx.fillText(`Dash: ${Math.ceil(dashCooldown/60)}s`, 20, cdY);
  } else {
    ctx.fillStyle = '#4af';
    ctx.fillText('Dash: READY [Shift]', 20, cdY);
  }

  // Shockwave cooldown indicator
  cdY += 14;
  if (shockwaveCooldown > 0) {
    ctx.fillStyle = '#888';
    ctx.fillText(`Shockwave: ${Math.ceil(shockwaveCooldown/60)}s`, 20, cdY);
  } else {
    ctx.fillStyle = '#4af';
    ctx.fillText('Shockwave: READY [Q]', 20, cdY);
  }

  // Wave & kills (top right)
  ctx.textAlign = 'right';
  ctx.font = 'bold 22px monospace';
  ctx.fillStyle = '#eee';
  ctx.fillText(`WAVE ${wave}`, CW - 20, 36);
  if (wave % 10 === 0 && zombies.some(z => z.isBoss)) {
    ctx.fillStyle = '#f4f';
    ctx.font = 'bold 14px monospace';
    ctx.fillText('⚠ BOSS WAVE', CW - 20, 54);
  }
  ctx.font = '14px monospace';
  ctx.fillStyle = '#aaa';
  ctx.fillText(`Kills: ${score}`, CW - 20, wave % 10 === 0 && zombies.some(z=>z.isBoss) ? 72 : 56);

  // Zombies remaining
  let remaining = zombies.length + zombiesLeft;
  if (remaining > 0) {
    ctx.textAlign = 'center';
    ctx.font = '13px monospace';
    ctx.fillStyle = '#888';
    ctx.fillText(`Zombies remaining: ${remaining}`, CW/2, 30);
  }

  // Shop hint
  if (!isMobile) {
    ctx.textAlign = 'center';
    ctx.font = '12px monospace';
    ctx.fillStyle = '#555';
    ctx.fillText('[B] Shop  •  [Space] Slash  •  [Shift] Dash  •  [Q] Shockwave', CW/2, CH - 12);
  }

  // Mobile touch controls overlay
  if (isMobile && screen === 'playing') {
    // Virtual joystick
    let jx = joystick.active ? joystick.startX : JOYSTICK_POS.x;
    let jy = joystick.active ? joystick.startY : JOYSTICK_POS.y;
    ctx.globalAlpha = 0.3;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(jx, jy, JOYSTICK_RADIUS, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#fff';
    let knobX = jx, knobY = jy;
    if (joystick.active) {
      let jdx = joystick.curX - joystick.startX;
      let jdy = joystick.curY - joystick.startY;
      let jdist = Math.sqrt(jdx*jdx + jdy*jdy);
      let clamp = Math.min(jdist, JOYSTICK_RADIUS);
      if (jdist > 0) { knobX = jx + (jdx/jdist)*clamp; knobY = jy + (jdy/jdist)*clamp; }
    }
    ctx.beginPath(); ctx.arc(knobX, knobY, 20, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;

    // Action buttons
    for (let btn of MOBILE_BUTTONS) {
      let isReady = true;
      let opacity = 0.6;
      if (btn.id === 'dash' && dashCooldown > 0) { isReady = false; opacity = 0.25; }
      if (btn.id === 'shockwave' && shockwaveCooldown > 0) { isReady = false; opacity = 0.25; }
      if (btn.id === 'attack' && (swinging || axeSwinging)) { opacity = 0.3; }
      ctx.globalAlpha = opacity;
      ctx.fillStyle = mobileButtonStates[btn.id] ? '#555' : '#333';
      ctx.strokeStyle = isReady ? '#fff' : '#666';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(btn.x, btn.y, btn.radius, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.globalAlpha = isReady ? 0.9 : 0.4;
      ctx.textAlign = 'center';
      ctx.font = `${btn.radius * 0.8}px monospace`;
      ctx.fillStyle = '#fff';
      ctx.fillText(btn.label, btn.x, btn.y + btn.radius * 0.3);
      ctx.globalAlpha = 1;
    }
  }

  // High score
  if (highScore > 0) {
    ctx.textAlign = 'right';
    ctx.font = '12px monospace';
    ctx.fillStyle = '#886';
    ctx.fillText(`Best: Wave ${highScore}`, CW - 20, CH - 12);
  }
}

function drawShop() {
  drawGrid();

  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, CW, CH);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#fd0';
  ctx.font = 'bold 32px monospace';
  ctx.fillText('⚔️  SHOP  ⚔️', CW/2, 50);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px monospace';
  ctx.fillText(`💰 $${money}`, CW/2, 78);

  ctx.fillStyle = '#888';
  ctx.font = '11px monospace';
  ctx.fillText(`Level ${level}  •  Wave ${wave}`, CW/2, 98);

  let itemKeys = Object.keys(UPGRADES);
  let startY = 140;
  let itemSpacing = 50;
  let clipTop = 110, clipBottom = 570, clipH = clipBottom - clipTop;

  // Clipping region for scrollable items
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, clipTop, CW, clipH);
  ctx.clip();

  for (let i = 0; i < itemKeys.length; i++) {
    let key = itemKeys[i];
    let up = UPGRADES[key];
    let lvl = upgradeLevels[key];
    let maxed = lvl >= up.maxLevel;
    let cost = maxed ? 0 : up.costs[lvl];
    let canAfford = money >= cost;
    let selected = i === shopSelection;
    let iy = startY + i * itemSpacing - shopScroll;

    // Skip items outside visible area
    if (iy + itemSpacing < clipTop || iy > clipBottom) continue;

    // Selection highlight
    if (selected) {
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(CW/2 - 240, iy - 3, 480, itemSpacing - 4);
      ctx.strokeStyle = '#fd0';
      ctx.lineWidth = 2;
      ctx.strokeRect(CW/2 - 240, iy - 3, 480, itemSpacing - 4);
    }

    // Icon & name
    ctx.textAlign = 'left';
    ctx.font = 'bold 15px monospace';
    ctx.fillStyle = up.color;
    ctx.fillText(`${up.icon} ${up.name}`, CW/2 - 225, iy + 12);

    // Level pips (compact for 10 levels)
    let pipX = CW/2 - 225;
    let pipY = iy + 20;
    for (let p = 0; p < up.maxLevel; p++) {
      ctx.fillStyle = p < lvl ? up.color : '#444';
      ctx.fillRect(pipX + p * 14, pipY, 10, 4);
    }

    // Description
    ctx.font = '11px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText(up.desc(lvl), CW/2 - 225, iy + 38);

    // Next level info
    ctx.textAlign = 'right';
    if (maxed) {
      ctx.font = 'bold 14px monospace';
      ctx.fillStyle = '#4c4';
      ctx.fillText('MAX', CW/2 + 225, iy + 12);
    } else {
      ctx.font = '11px monospace';
      ctx.fillStyle = '#888';
      ctx.fillText(`Next: ${up.desc(lvl+1)}`, CW/2 + 225, iy + 8);
      ctx.font = 'bold 14px monospace';
      ctx.fillStyle = canAfford ? '#fd0' : '#844';
      ctx.fillText(`$${cost}`, CW/2 + 225, iy + 26);
      if (selected && canAfford) {
        ctx.fillStyle = '#4c4';
        ctx.font = 'bold 11px monospace';
        ctx.fillText('[ CLICK / ENTER ]', CW/2 + 225, iy + 40);
      } else if (selected && !canAfford) {
        ctx.fillStyle = '#844';
        ctx.font = '11px monospace';
        ctx.fillText('Not enough $', CW/2 + 225, iy + 40);
      }
    }
  }

  // Play / continue button
  let playBtnY = startY + itemKeys.length * itemSpacing + 10 - shopScroll;
  if (playBtnY > clipTop && playBtnY < clipBottom) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#4c4';
    ctx.font = 'bold 18px monospace';
    let pulse = 0.7 + Math.sin(titlePulse * 2) * 0.3;
    ctx.globalAlpha = pulse;
    ctx.fillText(isMobile ? '[ TAP TO RESUME ]' : '[ START OVER  —  B / ESC ]', CW/2, playBtnY + 20);
    ctx.globalAlpha = 1;
  }

  ctx.restore(); // Remove clip

  // Scroll indicators
  let maxScroll = Math.max(0, itemKeys.length * itemSpacing + 60 - clipH);
  if (shopScroll > 0) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#888';
    ctx.font = '14px monospace';
    ctx.fillText('▲ scroll up ▲', CW/2, clipTop + 12);
  }
  if (shopScroll < maxScroll) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#888';
    ctx.font = '14px monospace';
    ctx.fillText('▼ scroll down ▼', CW/2, clipBottom - 4);
  }

  // Controls help
  ctx.textAlign = 'center';
  ctx.fillStyle = '#555';
  ctx.font = '11px monospace';
  ctx.fillText(isMobile ? 'Tap to buy  •  Scroll to browse' : 'W/S or ↑/↓ to browse  •  Scroll wheel  •  Enter/Click to buy  •  B/Esc to close', CW/2, CH - 14);
}

function drawDeathScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, CW, CH);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#f44';
  ctx.font = 'bold 48px monospace';
  ctx.fillText('YOU DIED', CW/2, 80);

  let wavesSurvived = wave - 1;

  // New high score?
  if (wavesSurvived >= highScore && wavesSurvived > 0) {
    ctx.fillStyle = '#ff0';
    ctx.font = 'bold 16px monospace';
    ctx.fillText('🏆 NEW HIGH SCORE! 🏆', CW/2, 108);
  } else if (highScore > 0) {
    ctx.fillStyle = '#886';
    ctx.font = '14px monospace';
    ctx.fillText(`Best: Wave ${highScore}`, CW/2, 108);
  }

  // Stats panel
  let panelX = CW/2 - 200, panelY = 125, panelW = 400, panelH = 340;
  ctx.fillStyle = 'rgba(30,30,50,0.85)';
  ctx.fillRect(panelX, panelY, panelW, panelH);
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  ctx.strokeRect(panelX, panelY, panelW, panelH);

  ctx.fillStyle = '#fd0';
  ctx.font = 'bold 18px monospace';
  ctx.fillText('— RUN STATS —', CW/2, panelY + 28);

  let timeSec = Math.floor(stats.timeSurvived / 60);
  let timeMin = Math.floor(timeSec / 60);
  let timeStr = timeMin > 0 ? `${timeMin}m ${timeSec % 60}s` : `${timeSec}s`;

  let statLines = [
    ['Waves Survived', `${wavesSurvived}`],
    ['Time Survived', timeStr],
    ['Total Kills', `${stats.kills}`],
    ['Bosses Killed', `${stats.bossesKilled}`],
    ['Damage Dealt', `${stats.damageDealt}`],
    ['Damage Taken', `${stats.damageTaken}`],
    ['XP Collected', `${stats.xpCollected}`],
    ['Money Earned', `$${stats.moneyEarned}`],
    ['Dashes Used', `${stats.dashesUsed}`],
    ['Shockwaves Used', `${stats.shockwavesUsed}`],
    ['Player Level', `${level}`]
  ];

  let sy = panelY + 52;
  ctx.font = '14px monospace';
  for (let i = 0; i < statLines.length; i++) {
    let ly = sy + i * 24;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#aaa';
    ctx.fillText(statLines[i][0], panelX + 30, ly);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.fillText(statLines[i][1], panelX + panelW - 30, ly);
  }

  // Money
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fd0';
  ctx.font = 'bold 16px monospace';
  ctx.fillText(`💰 You have $${money}`, CW/2, panelY + panelH + 30);

  let pulse = 0.6 + Math.sin(titlePulse * 2) * 0.4;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px monospace';
  ctx.fillText('Click to open Shop & Start Over', CW/2, panelY + panelH + 65);
  ctx.globalAlpha = 1;
}

function drawSword(angle, alpha, len, bladeColor) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(player.x, player.y);
  ctx.rotate(angle);
  ctx.strokeStyle = '#654';
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(player.radius-2,0); ctx.lineTo(player.radius+8,0); ctx.stroke();
  ctx.strokeStyle = '#aa8';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(player.radius+8,-6); ctx.lineTo(player.radius+8,6); ctx.stroke();
  ctx.strokeStyle = bladeColor;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(player.radius+8,0); ctx.lineTo(player.radius+len,0); ctx.stroke();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(player.radius+len-5,-2);
  ctx.lineTo(player.radius+len+3,0);
  ctx.lineTo(player.radius+len-5,2);
  ctx.stroke();
  ctx.restore();
}

function drawAxe(angle, alpha) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(player.x, player.y);
  ctx.rotate(angle);
  // Handle
  ctx.strokeStyle = '#8b5e3c';
  ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(player.radius - 2, 0); ctx.lineTo(player.radius + 50, 0); ctx.stroke();
  // Axe head
  ctx.fillStyle = '#aaa';
  ctx.beginPath();
  ctx.moveTo(player.radius + 40, -2);
  ctx.lineTo(player.radius + 55, -16);
  ctx.lineTo(player.radius + 70, -12);
  ctx.lineTo(player.radius + 72, 0);
  ctx.lineTo(player.radius + 70, 12);
  ctx.lineTo(player.radius + 55, 16);
  ctx.lineTo(player.radius + 40, 2);
  ctx.closePath();
  ctx.fill();
  // Edge highlight
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(player.radius + 55, -16);
  ctx.lineTo(player.radius + 72, 0);
  ctx.lineTo(player.radius + 55, 16);
  ctx.stroke();
  ctx.restore();
}

function roundRect(x,y,w,h,r) {
  if (w <= 0) return;
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.fill();
}

function angleDelta(a,b) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI*2;
  while (d < -Math.PI) d += Math.PI*2;
  return d;
}

// ── Game Loop ──────────────────────────────────────────
function loop() { update(); draw(); requestAnimationFrame(loop); }
init();
screen = 'title';
loop();
</script>
