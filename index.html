// ── Mobile Detection & Responsive Canvas ───────────────
const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.innerWidth <= 900 && 'ontouchstart' in window);
let canvasScale = 1;
let canvasOffsetX = 0, canvasOffsetY = 0;

function resizeCanvas() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const ratio = CW / CH;
  let drawW, drawH;
  if (w / h > ratio) {
    drawH = h;
    drawW = h * ratio;
  } else {
    drawW = w;
    drawH = w / ratio;
  }
  canvas.style.width = drawW + 'px';
  canvas.style.height = drawH + 'px';
  canvasScale = CW / drawW;
  canvasOffsetX = (w - drawW) / 2;
  canvasOffsetY = (h - drawH) / 2;
}
if (isMobile) {
  canvas.style.border = 'none';
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
}

// ── Player / Game State ────────────────────────────────
let player, zombies, particles, floatingTexts, bullets;
let xpOrbs, acidBullets;
let wave, zombiesLeft, spawnTimer, score;
let xp, xpToNext, level, money;
let crystals = 0;
let crystalUpgradeLevels = { shockwave: 0, dash: 0, vitality: 0 };
let upgradeLevels;
let swinging, swingTimer, autoSwingCooldown, gunCooldown;
let bossActive;
let shopSelection;
let dashCooldown, dashTimer, dashVx, dashVy;
let boomerangs, lightningEffects, poisonClouds;
let boomerangCooldown, lightningCooldown, orbitalAngle, flameCooldown, freezeCooldown, poisonCooldown;
let freezeBeamTimer, freezeBeamAngle;
let shopScroll;
const DASH_COOLDOWN_MAX = 120, DASH_DURATION = 10, DASH_SPEED = 12;
let shockwaveCooldown, shockwaveEffect;
const SHOCKWAVE_COOLDOWN_MAX = 480, SHOCKWAVE_RADIUS = 150;
let axeSwinging = false, axeSwingTimer = 0;
const AXE_SWING_DURATION = 40;
const AXE_COOLDOWN_MAX = 90;
let axeCooldown = 0;
let stats;
let mouse = { x: CW / 2, y: CH / 2 };
const keys = {};
const SWING_DURATION = 15;
const SWORD_ARC = Math.PI * 0.8;
let classSelectHover = -1;
let crystalShopSelection = 0;
let regenAccumulator = 0;

function xpForLevel(lvl) { return Math.floor(50 * Math.pow(lvl, 1.4)); }
function moneyForLevel(lvl) { return 8 + lvl * 4; }
function crystalsForLevel(lvl) { return Math.floor(1 + lvl * 0.4 + Math.random() * 2); }

function init() {
  upgradeLevels = { sword: 0, shield: 0, health: 0, autoSlash: 0, gun: 0, magnet: 0, boomerang: 0, lightning: 0, orbital: 0, flamethrower: 0, freeze: 0, poison: 0 };
  xp = 0;
  level = 1;
  xpToNext = xpForLevel(level);
  money = 0;
  if (!selectedClass) {
    screen = 'classSelect';
  } else {
    resetRun();
  }
}

function resetRun() {
  let cls = CLASSES[selectedClass] || CLASSES.tank;
  let crystalHpBonus = CRYSTAL_UPGRADES.vitality.hpBonus[crystalUpgradeLevels.vitality];
  let maxHp = Math.floor((100 + UPGRADES.health.bonus[upgradeLevels.health] + crystalHpBonus) * cls.hpMult);
  player = {
    x: CW / 2, y: CH / 2,
    radius: 20, speed: 3.2 * cls.speedMult, baseSpeed: 3.2 * cls.speedMult,
    hp: maxHp, maxHp: maxHp,
    angle: 0, iFrames: 0, damageFlash: 0
  };
  zombies = [];
  particles = [];
  floatingTexts = [];
  bullets = [];
  xpOrbs = [];
  acidBullets = [];
  wave = 0;
  zombiesLeft = 0;
  spawnTimer = 0;
  score = 0;
  // Keep level, xp, money, and upgrades across deaths
  swinging = false;
  swingTimer = 0;
  autoSwingCooldown = 0;
  gunCooldown = 0;
  bossActive = false;
  shopSelection = 0;
  dashCooldown = 0;
  dashTimer = 0;
  dashVx = 0;
  dashVy = 0;
  shockwaveCooldown = 0;
  shockwaveEffect = 0;
  axeSwinging = false;
  axeSwingTimer = 0;
  axeCooldown = 0;
  regenAccumulator = 0;
  boomerangs = [];
  lightningEffects = [];
  poisonClouds = [];
  boomerangCooldown = 0;
  lightningCooldown = 0;
  orbitalAngle = 0;
  flameCooldown = 0;
  freezeCooldown = 0;
  poisonCooldown = 0;
  freezeBeamTimer = 0;
  freezeBeamAngle = 0;
  shopScroll = 0;
  stats = { kills: 0, damageDealt: 0, damageTaken: 0, dashesUsed: 0, shockwavesUsed: 0, xpCollected: 0, moneyEarned: 0, timeSurvived: 0, highestWave: 0, bossesKilled: 0 };
  screen = 'playing';
  nextWave();
}

// ── Input ──────────────────────────────────────────────
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (screen === 'playing' && e.key === ' ') {
    e.preventDefault();
    let cls = CLASSES[selectedClass] || CLASSES.tank;
    if (cls.hasAxe) {
      if (!axeSwinging && axeCooldown <= 0) {
        axeSwinging = true;
        axeSwingTimer = AXE_SWING_DURATION;
      }
    } else if (!swinging) {
      swinging = true;
      swingTimer = SWING_DURATION;
    }
  } else if (screen === 'playing' && e.key === 'Shift') {
    // Dash
    let cls = CLASSES[selectedClass] || CLASSES.tank;
    let dashLvl = crystalUpgradeLevels.dash;
    let effCooldownMax = Math.floor(DASH_COOLDOWN_MAX * CRYSTAL_UPGRADES.dash.cdReduction[dashLvl] * (cls.dashCdMult || 1));
    let effDuration = DASH_DURATION + CRYSTAL_UPGRADES.dash.durationBonus[dashLvl];
    let effSpeed = DASH_SPEED + CRYSTAL_UPGRADES.dash.speedBonus[dashLvl];
    if (dashCooldown <= 0 && dashTimer <= 0) {
      let ddx = 0, ddy = 0;
      if (keys['w'] || keys['arrowup']) ddy -= 1;
      if (keys['s'] || keys['arrowdown']) ddy += 1;
      if (keys['a'] || keys['arrowleft']) ddx -= 1;
      if (keys['d'] || keys['arrowright']) ddx += 1;
      if (ddx === 0 && ddy === 0) {
        ddx = Math.cos(player.angle);
        ddy = Math.sin(player.angle);
      }
      let dlen = Math.sqrt(ddx * ddx + ddy * ddy);
      dashVx = (ddx / dlen) * effSpeed;
      dashVy = (ddy / dlen) * effSpeed;
      dashTimer = effDuration;
      dashCooldown = effCooldownMax;
      player.iFrames = Math.max(player.iFrames, effDuration + 5);
      stats.dashesUsed++;
    }
  } else if (screen === 'playing' && e.key.toLowerCase() === 'q') {
    // Shockwave
    let swLvl = crystalUpgradeLevels.shockwave;
    let effCd = Math.floor(SHOCKWAVE_COOLDOWN_MAX * CRYSTAL_UPGRADES.shockwave.cdReduction[swLvl]);
    if (shockwaveCooldown <= 0) {
      let swRadius = SHOCKWAVE_RADIUS + CRYSTAL_UPGRADES.shockwave.radiusBonus[swLvl];
      let swDmg = 5 + wave + CRYSTAL_UPGRADES.shockwave.dmgBonus[swLvl];
      shockwaveCooldown = effCd;
      shockwaveEffect = 20;
      stats.shockwavesUsed++;
      for (let z of zombies) {
        let d = Math.hypot(z.x - player.x, z.y - player.y);
        if (d < swRadius) {
          z.hp -= swDmg;
          z.hitFlash = 8;
          stats.damageDealt += swDmg;
          let a = Math.atan2(z.y - player.y, z.x - player.x);
          let kb = z.isBoss ? 15 : 30;
          z.x += Math.cos(a) * kb;
          z.y += Math.sin(a) * kb;
        }
      }
      spawnParticles(player.x, player.y, '#4af', 20);
    }
  } else if (screen === 'playing' && e.key.toLowerCase() === 'b') {
    screen = 'shop';
    shopSelection = 0;
    shopScroll = 0;
  } else if (screen === 'playing' && e.key.toLowerCase() === 'c') {
    screen = 'crystalShop';
    crystalShopSelection = 0;
  } else if (screen === 'crystalShop') {
    let cKeys = Object.keys(CRYSTAL_UPGRADES);
    if (e.key.toLowerCase() === 'c' || e.key === 'Escape') {
      screen = 'playing';
    } else if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') {
      crystalShopSelection = (crystalShopSelection - 1 + cKeys.length) % cKeys.length;
    } else if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') {
      crystalShopSelection = (crystalShopSelection + 1) % cKeys.length;
    } else if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      buyCrystalUpgrade(cKeys[crystalShopSelection]);
    }
  } else if (screen === 'playing' && e.key === '9') {
    // Cheat: clear all zombies, skip to next wave
    zombies.length = 0;
    zombiesLeft = 0;
  } else if (e.key === '$') {
    // Cheat: gain 999 money
    money += 999;
  } else if (screen === 'shop') {
    let itemKeys = Object.keys(UPGRADES);
    if (e.key.toLowerCase() === 'b' || e.key === 'Escape') {
      if (player.hp <= 0) { resetRun(); } else { screen = 'playing'; }
    } else if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') {
      shopSelection = (shopSelection - 1 + itemKeys.length) % itemKeys.length;
      ensureShopSelectionVisible();
    } else if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') {
      shopSelection = (shopSelection + 1) % itemKeys.length;
      ensureShopSelectionVisible();
    } else if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      buyUpgrade(itemKeys[shopSelection]);
    }
  }
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (CW / r.width);
  mouse.y = (e.clientY - r.top) * (CH / r.height);

  if (screen === 'shop') {
    let itemKeys = Object.keys(UPGRADES);
    let startY = 140;
    let itemSpacing = 50;
    for (let i = 0; i < itemKeys.length; i++) {
      let iy = startY + i * itemSpacing - shopScroll;
      if (iy < 130 || iy > 560) continue;
      if (mouse.x > CW/2 - 230 && mouse.x < CW/2 + 230 && mouse.y > iy - 5 && mouse.y < iy + itemSpacing - 2) {
        shopSelection = i;
      }
    }
  }
});

canvas.addEventListener('mousedown', e => {
  if (screen === 'title') {
    screen = 'classSelect';
    classSelectHover = -1;
    return;
  }
  if (screen === 'classSelect') {
    let classKeys = Object.keys(CLASSES);
    let startX = CW/2 - (classKeys.length * 140) / 2 + 70;
    for (let i = 0; i < classKeys.length; i++) {
      let cx = startX + i * 140;
      let cy = CH/2 + 20;
      if (Math.abs(mouse.x - cx) < 65 && Math.abs(mouse.y - cy) < 80) {
        selectedClass = classKeys[i];
        screen = 'playing';
        init();
        return;
      }
    }
    return;
  }
  if (screen === 'dead') {
    screen = 'shop';
    shopSelection = 0;
    shopScroll = 0;
    return;
  }
  if (screen === 'shop') {
    let itemKeys = Object.keys(UPGRADES);
    let startY = 140;
    let itemSpacing = 50;
    for (let i = 0; i < itemKeys.length; i++) {
      let iy = startY + i * itemSpacing - shopScroll;
      if (iy < 130 || iy > 560) continue;
      if (mouse.x > CW/2 - 230 && mouse.x < CW/2 + 230 && mouse.y > iy - 5 && mouse.y < iy + itemSpacing - 2) {
        shopSelection = i;
        buyUpgrade(itemKeys[i]);
        return;
      }
    }
    // Check Play button
    let totalH = itemKeys.length * itemSpacing;
    let playBtnY = startY + totalH + 10 - shopScroll;
    if (playBtnY > 130 && playBtnY < 580 && mouse.y > playBtnY - 5 && mouse.y < playBtnY + 40) {
      if (player.hp <= 0) { resetRun(); } else { screen = 'playing'; }
    }
    return;
  }
  if (screen === 'crystalShop') {
    let cKeys = Object.keys(CRYSTAL_UPGRADES);
    let startY = 150;
    let itemSpacing = 80;
    for (let i = 0; i < cKeys.length; i++) {
      let iy = startY + i * itemSpacing;
      if (mouse.x > CW/2 - 250 && mouse.x < CW/2 + 250 && mouse.y > iy && mouse.y < iy + 65) {
        crystalShopSelection = i;
        buyCrystalUpgrade(cKeys[i]);
        return;
      }
    }
    return;
  }
  // Playing state: attack on click
  if (screen === 'playing') {
    let cls = CLASSES[selectedClass] || CLASSES.tank;
    if (cls.hasAxe) {
      if (!axeSwinging && axeCooldown <= 0) {
        axeSwinging = true;
        axeSwingTimer = AXE_SWING_DURATION;
      }
    } else if (!swinging) {
      swinging = true;
      swingTimer = SWING_DURATION;
    }
  }
});

canvas.addEventListener('wheel', e => {
  if (screen === 'shop') {
    e.preventDefault();
    let itemKeys = Object.keys(UPGRADES);
    let maxScroll = Math.max(0, itemKeys.length * 50 + 60 - 420);
    shopScroll = Math.max(0, Math.min(maxScroll, shopScroll + e.deltaY * 0.5));
  }
}, { passive: false });

// ── Mobile Touch Input ─────────────────────────────────
function getTouchCanvasPos(touch) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (touch.clientX - r.left) * (CW / r.width),
    y: (touch.clientY - r.top) * (CH / r.height)
  };
}

if (isMobile) {
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    for (let t of e.changedTouches) {
      let pos = getTouchCanvasPos(t);

      // Title / class select / dead screens — tap anywhere
      if (screen === 'title') { screen = 'classSelect'; classSelectHover = -1; return; }
      if (screen === 'classSelect') {
        let classKeys = Object.keys(CLASSES);
        let startX = CW/2 - (classKeys.length * 140) / 2 + 70;
        for (let i = 0; i < classKeys.length; i++) {
          let cx = startX + i * 140;
          let cy = CH/2 + 20;
          if (Math.abs(pos.x - cx) < 65 && Math.abs(pos.y - cy) < 80) {
            selectedClass = classKeys[i];
            screen = 'playing';
            init();
            return;
          }
        }
        return;
      }
      if (screen === 'dead') { screen = 'shop'; shopSelection = 0; shopScroll = 0; return; }

      // Shop screens — handle tap on items
      if (screen === 'shop') {
        let itemKeys = Object.keys(UPGRADES);
        let startY = 140, itemSpacing = 50;
        for (let i = 0; i < itemKeys.length; i++) {
          let iy = startY + i * itemSpacing - shopScroll;
          if (iy < 130 || iy > 560) continue;
          if (pos.x > CW/2 - 250 && pos.x < CW/2 + 250 && pos.y > iy - 5 && pos.y < iy + itemSpacing - 2) {
            shopSelection = i;
            buyUpgrade(itemKeys[i]);
            return;
          }
        }
        // Play button
        let totalH = itemKeys.length * itemSpacing;
        let playBtnY = startY + totalH + 10 - shopScroll;
        if (pos.y > playBtnY - 10 && pos.y < playBtnY + 50) {
          if (player.hp <= 0) { resetRun(); } else { screen = 'playing'; }
        }
        return;
      }
      if (screen === 'crystalShop') {
        let cKeys = Object.keys(CRYSTAL_UPGRADES);
        let startY = 150, itemSpacing = 80;
        for (let i = 0; i < cKeys.length; i++) {
          let iy = startY + i * itemSpacing;
          if (pos.x > CW/2 - 260 && pos.x < CW/2 + 260 && pos.y > iy && pos.y < iy + 65) {
            crystalShopSelection = i;
            buyCrystalUpgrade(cKeys[i]);
            return;
          }
        }
        // Tap top area to close
        if (pos.y > CH - 60) { screen = 'playing'; }
        return;
      }

      // Playing state: check buttons first
      if (screen === 'playing') {
        let hitBtn = false;
        for (let btn of MOBILE_BUTTONS) {
          if (Math.hypot(pos.x - btn.x, pos.y - btn.y) < btn.radius + 10) {
            hitBtn = true;
            mobileButtonStates[btn.id] = true;
            if (btn.id === 'attack') {
              let cls = CLASSES[selectedClass] || CLASSES.tank;
              if (cls.hasAxe) {
                if (!axeSwinging && axeCooldown <= 0) { axeSwinging = true; axeSwingTimer = AXE_SWING_DURATION; }
              } else if (!swinging) { swinging = true; swingTimer = SWING_DURATION; }
            } else if (btn.id === 'dash') {
              let cls = CLASSES[selectedClass] || CLASSES.tank;
              let dashLvl = crystalUpgradeLevels.dash;
              let effCooldownMax = Math.floor(DASH_COOLDOWN_MAX * CRYSTAL_UPGRADES.dash.cdReduction[dashLvl] * (cls.dashCdMult || 1));
              let effDuration = DASH_DURATION + CRYSTAL_UPGRADES.dash.durationBonus[dashLvl];
              let effSpeed = DASH_SPEED + CRYSTAL_UPGRADES.dash.speedBonus[dashLvl];
              if (dashCooldown <= 0 && dashTimer <= 0) {
                let ddx = joystick.active ? (joystick.curX - joystick.startX) : 0;
                let ddy = joystick.active ? (joystick.curY - joystick.startY) : 0;
                if (Math.abs(ddx) < 5 && Math.abs(ddy) < 5) { ddx = Math.cos(player.angle); ddy = Math.sin(player.angle); }
                let dlen = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
                dashVx = (ddx / dlen) * effSpeed;
                dashVy = (ddy / dlen) * effSpeed;
                dashTimer = effDuration;
                dashCooldown = effCooldownMax;
                player.iFrames = Math.max(player.iFrames, effDuration + 5);
                stats.dashesUsed++;
              }
            } else if (btn.id === 'shockwave') {
              let swLvl = crystalUpgradeLevels.shockwave;
              let effCd = Math.floor(SHOCKWAVE_COOLDOWN_MAX * CRYSTAL_UPGRADES.shockwave.cdReduction[swLvl]);
              if (shockwaveCooldown <= 0) {
                let swRadius = SHOCKWAVE_RADIUS + CRYSTAL_UPGRADES.shockwave.radiusBonus[swLvl];
                let swDmg = 5 + wave + CRYSTAL_UPGRADES.shockwave.dmgBonus[swLvl];
                shockwaveCooldown = effCd;
                shockwaveEffect = 20;
                stats.shockwavesUsed++;
                for (let z of zombies) {
                  let d = Math.hypot(z.x - player.x, z.y - player.y);
                  if (d < swRadius) {
                    z.hp -= swDmg; z.hitFlash = 8; stats.damageDealt += swDmg;
                    let a = Math.atan2(z.y - player.y, z.x - player.x);
                    let kb = z.isBoss ? 15 : 30;
                    z.x += Math.cos(a) * kb; z.y += Math.sin(a) * kb;
                  }
                }
                spawnParticles(player.x, player.y, '#4af', 20);
              }
            } else if (btn.id === 'shop') {
              screen = 'shop'; shopSelection = 0; shopScroll = 0;
            } else if (btn.id === 'crystal') {
              screen = 'crystalShop'; crystalShopSelection = 0;
            }
            break;
          }
        }
        // Joystick — left side of screen
        if (!hitBtn && pos.x < CW / 2) {
          joystick.active = true;
          joystick.touchId = t.identifier;
          joystick.startX = pos.x;
          joystick.startY = pos.y;
          joystick.curX = pos.x;
          joystick.curY = pos.y;
        }
        // Tap right side (not on a button) = aim toward that point
        if (!hitBtn && pos.x >= CW / 2) {
          touchAimX = pos.x;
          touchAimY = pos.y;
          player.angle = Math.atan2(pos.y - player.y, pos.x - player.x);
        }
      }
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    for (let t of e.changedTouches) {
      let pos = getTouchCanvasPos(t);
      if (joystick.active && t.identifier === joystick.touchId) {
        joystick.curX = pos.x;
        joystick.curY = pos.y;
      }
      // Shop scroll via drag
      if (screen === 'shop') {
        let itemKeys = Object.keys(UPGRADES);
        let maxScroll = Math.max(0, itemKeys.length * 50 + 60 - 420);
        if (lastTouchScrollY !== null) {
          shopScroll = Math.max(0, Math.min(maxScroll, shopScroll - (pos.y - lastTouchScrollY)));
        }
        lastTouchScrollY = pos.y;
      }
    }
  }, { passive: false });

  canvas.addEventListener('touchend', e => {
    for (let t of e.changedTouches) {
      if (joystick.active && t.identifier === joystick.touchId) {
        joystick.active = false;
        joystick.touchId = null;
      }
      // Reset button states
      for (let btn of MOBILE_BUTTONS) {
        mobileButtonStates[btn.id] = false;
      }
    }
    lastTouchScrollY = null;
  });

  canvas.addEventListener('touchcancel', e => {
    joystick.active = false;
    joystick.touchId = null;
    lastTouchScrollY = null;
    for (let btn of MOBILE_BUTTONS) mobileButtonStates[btn.id] = false;
  });
}

function ensureShopSelectionVisible() {
  let itemSpacing = 50;
  let startY = 140;
  let iy = startY + shopSelection * itemSpacing - shopScroll;
  if (iy < 140) shopScroll -= (140 - iy);
  if (iy + itemSpacing > 560) shopScroll += (iy + itemSpacing - 560);
  let itemKeys = Object.keys(UPGRADES);
  let maxScroll = Math.max(0, itemKeys.length * itemSpacing + 60 - 420);
  shopScroll = Math.max(0, Math.min(maxScroll, shopScroll));
}

// ── Shop ───────────────────────────────────────────────
function buyUpgrade(key) {
  let up = UPGRADES[key];
  let lvl = upgradeLevels[key];
  if (lvl >= up.maxLevel) return;
  let cost = up.costs[lvl];
  if (money >= cost) {
    money -= cost;
    upgradeLevels[key]++;
    // Apply health upgrade immediately
    if (key === 'health') {
      let newMax = 100 + UPGRADES.health.bonus[upgradeLevels.health];
      let diff = newMax - player.maxHp;
      player.maxHp = newMax;
      player.hp = Math.min(player.hp + diff, player.maxHp);
    }
  }
}

// ── Crystal Shop ───────────────────────────────────────
function buyCrystalUpgrade(key) {
  let up = CRYSTAL_UPGRADES[key];
  let lvl = crystalUpgradeLevels[key];
  if (lvl >= up.maxLevel) return;
  let cost = up.costs[lvl];
  if (crystals >= cost) {
    crystals -= cost;
    crystalUpgradeLevels[key]++;
    // Apply vitality HP bonus immediately
    if (key === 'vitality') {
      let cls = CLASSES[selectedClass] || CLASSES.tank;
      let newMax = Math.floor((100 + UPGRADES.health.bonus[upgradeLevels.health] + CRYSTAL_UPGRADES.vitality.hpBonus[crystalUpgradeLevels.vitality]) * cls.hpMult);
      let diff = newMax - player.maxHp;
      player.maxHp = newMax;
      player.hp = Math.min(player.hp + diff, player.maxHp);
    }
  }
}

// ── Floating Text ──────────────────────────────────────
function addFloatingText(x, y, text, color) {
  floatingTexts.push({ x, y, text, color, life: 50, maxLife: 50 });
}

// ── Waves ──────────────────────────────────────────────
function nextWave() {
  wave++;
  zombiesLeft = 3 + wave * 2;
  bossActive = false;
  // Boss wave every 10
  if (wave % 10 === 0) {
    bossActive = true;
    zombiesLeft += 1; // boss counted as one of the spawns
  }
  spawnTimer = 0;
}
let bossSpawned = false;

function pickZombieType() {
  let types = ['walker'];
  if (wave >= 3) types.push('runner');
  if (wave >= 5) types.push('tank');
  if (wave >= 7) types.push('spitter');
  if (wave >= 8) types.push('splitter');
  if (wave >= 10) types.push('exploder');
  if (wave >= 12) types.push('ghost');
  if (wave >= 15) types.push('necromancer');
  // Weighted: walker always most common
  let weights = types.map(t => {
    if (t === 'walker') return 10;
    if (t === 'runner') return 6;
    if (t === 'tank') return 4;
    if (t === 'spitter') return 3;
    if (t === 'splitter') return 3;
    if (t === 'exploder') return 2;
    if (t === 'ghost') return 2;
    if (t === 'necromancer') return 1;
    return 1;
  });
  let total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < types.length; i++) {
    r -= weights[i];
    if (r <= 0) return types[i];
  }
  return 'walker';
}

function spawnZombie() {
  let angle = Math.random() * Math.PI * 2;
  let dist = Math.max(CW, CH) / 2 + 60;
  let x = CW / 2 + Math.cos(angle) * dist;
  let y = CH / 2 + Math.sin(angle) * dist;
  let baseSpeed = 0.8 + Math.random() * 0.5 + wave * 0.05;
  let baseHp = 2 + Math.floor(wave / 3);
  let baseDamage = 8 + Math.floor(wave / 2);
  let radius = 16 + Math.random() * 6;

  let type = pickZombieType();

  let z = {
    x, y, radius, speed: baseSpeed, hp: baseHp, maxHp: baseHp,
    damage: baseDamage, hitFlash: 0, attackCooldown: 0,
    isBoss: false, bossCharging: false, chargeTimer: 0, chargeCooldown: 0,
    chargeVx: 0, chargeVy: 0,
    zombieType: type, ghostPhase: 0, ghostSolid: true, necroTimer: 0,
    exploded: false, spitCooldown: 60 + Math.floor(Math.random() * 60),
    burnTimer: 0, burnDmg: 0, slowTimer: 0, slowFactor: 1,
    aggro: !(CLASSES[selectedClass] && CLASSES[selectedClass].passive)
  };

  // Type-specific stat adjustments
  if (type === 'runner') {
    z.speed *= 1.5;
    z.hp = Math.max(1, Math.floor(z.hp * 0.6));
    z.maxHp = z.hp;
    z.damage = Math.max(1, Math.floor(z.damage * 0.8));
  } else if (type === 'tank') {
    z.speed *= 0.6;
    z.hp = Math.floor(z.hp * 2.5);
    z.maxHp = z.hp;
    z.damage = Math.floor(z.damage * 1.5);
    z.radius = 22 + Math.random() * 4;
  } else if (type === 'spitter') {
    z.hp = Math.max(1, Math.floor(z.hp * 0.7));
    z.maxHp = z.hp;
    z.speed *= 0.8;
  } else if (type === 'splitter') {
    z.radius = 18 + Math.random() * 4;
  } else if (type === 'exploder') {
    z.speed *= 1.3;
    z.hp = Math.max(1, Math.floor(z.hp * 0.8));
    z.maxHp = z.hp;
  } else if (type === 'ghost') {
    z.speed *= 1.1;
    z.ghostPhase = Math.random() * 120;
  } else if (type === 'necromancer') {
    z.hp = Math.floor(z.hp * 2);
    z.maxHp = z.hp;
    z.radius = 22;
    z.speed *= 0.7;
    z.necroTimer = 180 + Math.floor(Math.random() * 120);
  }

  zombies.push(z);
}

function spawnMiniZombie(parentX, parentY, parentWave) {
  let offset = (Math.random() - 0.5) * 30;
  let baseHp = Math.max(1, Math.floor((2 + Math.floor(parentWave / 3)) * 0.5));
  zombies.push({

    isBoss: false, bossCharging: false, chargeTimer: 0, chargeCooldown: 0,
    chargeVx: 0, chargeVy: 0,
    zombieType: 'mini', ghostPhase: 0, ghostSolid: true, necroTimer: 0,
